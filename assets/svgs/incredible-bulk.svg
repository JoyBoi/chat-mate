<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#e6ffe6" stroke="#00cc00" stroke-width="3">
    <animate attributeName="fill" values="#e6ffe6;#ccffcc;#e6ffe6" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00cc00;#00ff00;#00cc00" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;4;3" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Muscular body -->
  <path d="M70 100 Q100 90 130 100 L140 180 Q100 170 60 180 Z" fill="#90ee90">
    <animate attributeName="fill" values="#90ee90;#7cfc00;#90ee90" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.02;1" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Head -->
  <ellipse cx="100" cy="75" rx="30" ry="35" fill="#90ee90">
    <animate attributeName="fill" values="#90ee90;#7cfc00;#90ee90" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Hair -->
  <path d="M75 50 Q100 40 125 50 L120 65 Q100 55 80 65 Z" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Angry eyebrows -->
  <path d="M80 65 L95 70" fill="none" stroke="#006400" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke" values="#006400;#00ff00;#006400" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;4;3" dur="1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0;0,1;0,0" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M120 65 L105 70" fill="none" stroke="#006400" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke" values="#006400;#00ff00;#006400" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;4;3" dur="1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0;0,1;0,0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="75" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;4;8" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="115" cy="75" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;4;8" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="85" cy="75" r="3" fill="#006400">
    <animate attributeName="fill" values="#006400;#00ff00;#006400" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="75" r="3" fill="#006400">
    <animate attributeName="fill" values="#006400;#00ff00;#006400" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Nose -->
  <polygon points="100,85 95,95 105,95" fill="#7cfc00"/>
  
  <!-- Mouth -->
  <path d="M90 100 Q100 110 110 100" fill="none" stroke="#006400" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Neck -->
  <rect x="90" y="100" width="20" height="10" fill="#90ee90"/>
  
  <!-- Muscles -->
  <ellipse cx="70" cy="120" rx="15" ry="20" fill="#7cfc00">
    <animate attributeName="rx" values="15;18;15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="20;23;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#7cfc00;#90ee90;#7cfc00" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="130" cy="120" rx="15" ry="20" fill="#7cfc00">
    <animate attributeName="rx" values="15;18;15" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="ry" values="20;23;20" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="fill" values="#7cfc00;#90ee90;#7cfc00" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </ellipse>
  
  <!-- Six pack -->
  <rect x="90" y="120" width="20" height="10" rx="5" ry="5" fill="#7cfc00">
    <animate attributeName="fill" values="#7cfc00;#90ee90;#7cfc00" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="20;22;20" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="90" y="135" width="20" height="10" rx="5" ry="5" fill="#7cfc00">
    <animate attributeName="fill" values="#7cfc00;#90ee90;#7cfc00" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="width" values="20;22;20" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  <rect x="90" y="150" width="20" height="10" rx="5" ry="5" fill="#7cfc00">
    <animate attributeName="fill" values="#7cfc00;#90ee90;#7cfc00" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="width" values="20;22;20" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </rect>
  
  <!-- Torn shorts -->
  <path d="M75 160 Q100 155 125 160 L120 180 Q100 175 80 180 Z" fill="#4b0082"/>
  <path d="M90 160 L85 170" fill="none" stroke="#e6e6fa" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 160 L115 170" fill="none" stroke="#e6e6fa" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Fitness elements -->
  <circle cx="50" cy="150" r="10" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 50 150;360 50 150" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="47" y="153" font-family="Arial" font-size="10" fill="white">
    <animate attributeName="fill" values="white;#f0f0f0;white" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 50 150;360 50 150" dur="4s" repeatCount="indefinite"/>
    kg
  </text>
  
  <!-- Protein shake -->
  <rect x="140" y="140" width="10" height="15" fill="#f5f5dc">
    <animate attributeName="fill" values="#f5f5dc;#fff8dc;#f5f5dc" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0;0,2;0,0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <path d="M140 140 Q145 135 150 140" fill="none" stroke="#f5f5dc" stroke-width="2">
    <animate attributeName="stroke" values="#f5f5dc;#fff8dc;#f5f5dc" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0;0,2;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Veins -->
  <path d="M65 120 L60 110" fill="none" stroke="#006400" stroke-width="1" stroke-linecap="round">
    <animate attributeName="stroke" values="#006400;#00ff00;#006400" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;2;1" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M135 120 L140 110" fill="none" stroke="#006400" stroke-width="1" stroke-linecap="round">
    <animate attributeName="stroke" values="#006400;#00ff00;#006400" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="stroke-width" values="1;2;1" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  
  <!-- Sweat drops -->
  <circle cx="75" cy="60" r="2" fill="#87ceeb">
    <animate attributeName="cy" values="60;70;60" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="125" cy="60" r="2" fill="#87ceeb">
    <animate attributeName="cy" values="60;70;60" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="fill-opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <!-- Power particles -->
  <circle cx="30" cy="90" r="1" fill="#00ff00" fill-opacity="0.7">
    <animate attributeName="cy" values="90;70;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="110" r="1" fill="#7cfc00" fill-opacity="0.7">
    <animate attributeName="cy" values="110;130;110" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;1.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Superhero energy waves -->
  <path d="M 20 60 Q 100 50 180 60" stroke="#00ff00" stroke-width="1" fill="none" stroke-opacity="0.4">
    <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="d" values="M 20 60 Q 100 50 180 60;M 20 65 Q 100 55 180 65;M 20 60 Q 100 50 180 60" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 25 140 Q 100 130 175 140" stroke="#7cfc00" stroke-width="1" fill="none" stroke-opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.1;0.7;0.1" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="d" values="M 25 140 Q 100 130 175 140;M 25 135 Q 100 125 175 135;M 25 140 Q 100 130 175 140" dur="1.8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Gamma radiation particles -->
  <circle cx="50" cy="40" r="0.8" fill="#32cd32" fill-opacity="0.6">
    <animate attributeName="cy" values="40;20;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0.8;1.2;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="45" r="0.6" fill="#00ff7f" fill-opacity="0.5">
    <animate attributeName="cy" values="45;25;45" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.1;0.8;0.1" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="25" y="130" font-family="serif" font-size="8" fill="#006400" fill-opacity="0.6">
    <animate attributeName="x" values="25;30;25" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
    💪
  </text>
  <text x="175" y="170" font-family="serif" font-size="6" fill="#00ff00" fill-opacity="0.6">
    <animate attributeName="x" values="175;170;175" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    ⚡
  </text>
  
  <!-- Superhero power aura -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#00ff00" stroke-width="2" stroke-opacity="0.2">
    <animate attributeName="r" values="70;75;70" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00ff00;#7cfc00;#00ff00" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>