<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="#ff0000" stroke-width="3">
    <animate attributeName="fill" values="#1a1a2e;#2a2a3e;#1a1a2e" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#ff0000;#ff3333;#ff0000" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Helmet -->
  <path d="M60 60 Q100 40 140 60 L145 120 Q100 140 55 120 Z" fill="#000000">
    <animate attributeName="fill" values="#000000;#111111;#000000" dur="6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Helmet details -->
  <path d="M70 60 Q100 45 130 60 L125 90 Q100 75 75 90 Z" fill="#111111">
    <animate attributeName="fill" values="#111111;#222222;#111111" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M75 90 Q100 80 125 90 L120 115 Q100 105 80 115 Z" fill="#222222">
    <animate attributeName="fill" values="#222222;#333333;#222222" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Face mask -->
  <path d="M80 70 Q100 65 120 70 L115 110 Q100 115 85 110 Z" fill="#333333">
    <animate attributeName="fill" values="#333333;#444444;#333333" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.02;1" dur="2.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Eyes -->
  <path d="M85 80 L95 80 L95 90 L85 90 Z" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ff6666;#ff0000" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M105 80 L115 80 L115 90 L105 90 Z" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ff6666;#ff0000" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Breathing apparatus -->
  <rect x="90" y="95" width="20" height="15" rx="5" ry="5" fill="#444444">
    <animate attributeName="fill" values="#444444;#666666;#444444" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="95" y="95" width="10" height="15" rx="2" ry="2" fill="#555555">
    <animate attributeName="fill" values="#555555;#777777;#555555" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="10;11;10" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Neck -->
  <rect x="85" y="120" width="30" height="10" fill="#000000">
    <animate attributeName="fill" values="#000000;#111111;#000000" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Cape -->
  <path d="M60 130 Q100 120 140 130 L150 190 Q100 170 50 190 Z" fill="#000000">
    <animateTransform attributeName="transform" type="rotate" values="0 100 130;2 100 130;0 100 130;-2 100 130;0 100 130" dur="6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Chest panel -->
  <rect x="85" y="130" width="30" height="20" rx="2" ry="2" fill="#333333">
    <animate attributeName="fill" values="#333333;#444444;#333333" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#555555;#777777;#555555" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Control buttons (reduced for better character focus) -->
  <circle cx="92" cy="135" r="2" fill="#ff0000">
    <animate attributeName="r" values="2;2.5;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="135" r="2" fill="#00ff00">
    <animate attributeName="r" values="2;2.5;2" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="108" cy="135" r="2" fill="#0000ff">
    <animate attributeName="r" values="2;2.5;2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Code symbols (simplified) -->
  <text x="95" y="145" font-family="monospace" font-size="7" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#66ff66;#00ff00" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.6;0.8;0.6" dur="4s" repeatCount="indefinite"/>
    {}
  </text>
  
  <!-- Lightsaber -->
  <rect x="130" y="140" width="5" height="20" rx="2" ry="2" fill="#888888">
    <animate attributeName="fill" values="#888888;#aaaaaa;#888888" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="130" y="110" width="5" height="30" rx="1" ry="1" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ff6666;#ff0000" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Lightsaber glow -->
  <rect x="128" y="108" width="9" height="34" rx="3" ry="3" fill="#ff0000" fill-opacity="0.3">
    <animate attributeName="fill-opacity" values="0.2;0.5;0.2" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Belt -->
  <rect x="80" y="150" width="40" height="5" fill="#555555">
    <animate attributeName="fill" values="#555555;#777777;#555555" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="95" y="150" width="10" height="5" fill="#888888">
    <animate attributeName="fill" values="#888888;#aaaaaa;#888888" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Subtle tech ambiance -->
  <circle cx="160" cy="100" r="1" fill="#0000ff" fill-opacity="0.3">
    <animate attributeName="fill-opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  

  
  <!-- Death Star symbol -->
  <circle cx="180" cy="50" r="8" fill="#333333" stroke="#666666" stroke-width="1">
    <animate attributeName="fill" values="#333333;#555555;#333333" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="8;9;8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="182" cy="48" r="2" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ff6666;#ff0000" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Imperial logo -->
  <text x="40" y="180" font-family="serif" font-size="12" fill="#666666" fill-opacity="0.7">
    <animate attributeName="fill" values="#666666;#888888;#666666" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
    ⚡
  </text>
  

  
  <!-- Terminal window -->
  <rect x="20" y="80" width="50" height="30" rx="3" ry="3" fill="#000000" stroke="#333333" stroke-width="1">
    <animate attributeName="fill" values="#000000;#111111;#000000" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#333333;#555555;#333333" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="20" y="80" width="50" height="8" rx="3" ry="3" fill="#333333">
    <animate attributeName="fill" values="#333333;#555555;#333333" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="23" y="95" font-family="monospace" font-size="6" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#66ff66;#00ff00" dur="2s" repeatCount="indefinite"/>
    > sudo rm -rf
  </text>
  <text x="23" y="102" font-family="monospace" font-size="6" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ff6666;#ff0000" dur="2.5s" repeatCount="indefinite"/>
    ERROR: Access
  </text>
  
  <!-- Enhanced Force lightning -->
  <path d="M50 90 Q60 85 70 95 Q80 90 90 100" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00ffff;#ffffff;#00ffff" dur="0.3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;4;2" dur="0.4s" repeatCount="indefinite"/>
  </path>
  <path d="M150 95 Q140 90 130 100 Q120 95 110 105" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00ffff;#ffffff;#00ffff" dur="0.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;4;2" dur="0.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Dark side aura -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#ff0000" stroke-width="1" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="80;85;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#ff0000;#ff3333;#ff0000" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating IDE icons -->
  <text x="160" y="120" font-family="monospace" font-size="10" fill="#ffff00" fill-opacity="0.6">
    <animate attributeName="y" values="120;110;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#ffff00;#ffffff;#ffff00" dur="2s" repeatCount="indefinite"/>
    ⚙
  </text>
  <text x="25" y="140" font-family="monospace" font-size="10" fill="#ff00ff" fill-opacity="0.6">
    <animate attributeName="y" values="140;130;140" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#ff00ff;#ffffff;#ff00ff" dur="2.5s" repeatCount="indefinite"/>
    ⌨
  </text>
  
  <!-- Animated TIE Fighter -->
  <circle cx="170" cy="160" r="6" fill="#333333">
    <animate attributeName="fill" values="#333333;#555555;#333333" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;5,0;-5,0;0,0" dur="3s" repeatCount="indefinite" additive="sum" />
  </circle>
  <rect x="164" y="157" width="12" height="6" fill="#666666">
    <animate attributeName="fill" values="#666666;#888888;#666666" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;5,0;-5,0;0,0" dur="3s" repeatCount="indefinite" additive="sum" />
  </rect>
  <rect x="158" y="154" width="6" height="12" fill="#444444">
    <animate attributeName="fill" values="#444444;#666666;#444444" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;5,0;-5,0;0,0" dur="3s" repeatCount="indefinite" additive="sum" />
  </rect>
  <rect x="176" y="154" width="6" height="12" fill="#444444">
    <animate attributeName="fill" values="#444444;#666666;#444444" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;5,0;-5,0;0,0" dur="3s" repeatCount="indefinite" additive="sum" />
  </rect>
  

  
  <!-- Animated Death Star laser -->
  <path d="M180 50 L100 100" fill="none" stroke="#ff0000" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite" begin="0s" />
    <animate attributeName="stroke" values="#ff0000;#ffffff;#ff0000" dur="0.2s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="3;6;3" dur="0.25s" repeatCount="indefinite" />
  </path>
  <circle cx="100" cy="100" r="3" fill="#ff0000" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite" begin="0s" />
    <animate attributeName="fill" values="#ff0000;#ffffff;#ff0000" dur="0.2s" repeatCount="indefinite" />
    <animate attributeName="r" values="3;8;3" dur="0.25s" repeatCount="indefinite" />
  </circle>
  

  
  <!-- Animated Sith holocron -->
  <polygon points="30,50 40,55 30,60 20,55" fill="#8b0000">
    <animate attributeName="fill" values="#8b0000;#ff0000;#8b0000;#dc143c;#8b0000" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="0 30 55;360 30 55" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
  </polygon>
  <circle cx="30" cy="55" r="2" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ffffff;#ff0000" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="0 30 55;360 30 55" dur="6s" repeatCount="indefinite" />
  </circle>
  
  <!-- Animated Imperial probe droid -->
  <circle cx="150" cy="30" r="4" fill="#333333">
    <animate attributeName="fill" values="#333333;#555555;#333333" dur="2.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,2;0,0" dur="3s" repeatCount="indefinite" additive="sum" />
  </circle>
  <path d="M146 30 L142 28 M154 30 L158 28 M150 26 L150 22 M150 34 L150 38" fill="none" stroke="#666666" stroke-width="1">
    <animate attributeName="stroke" values="#666666;#888888;#666666" dur="2.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,2;0,0" dur="3s" repeatCount="indefinite" additive="sum" />
  </path>
  <circle cx="150" cy="30" r="1" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ffffff;#ff0000" dur="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,2;0,0" dur="3s" repeatCount="indefinite" additive="sum" />
  </circle>
</svg>