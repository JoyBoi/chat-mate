<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f5f5dc" stroke="#8b4513" stroke-width="3">
    <animate attributeName="fill" values="#f5f5dc;#ffeaa7;#f5f5dc" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#8b4513;#a0522d;#8b4513" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="35" ry="40" fill="#fdbcb4">
    <animate attributeName="fill" values="#fdbcb4;#ffcccb;#fdbcb4" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Balding head -->
  <path d="M70 60 Q100 45 130 60 L125 80 Q100 65 75 80 Z" fill="#fdbcb4">
    <animate attributeName="fill" values="#fdbcb4;#ffcccb;#fdbcb4" dur="5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Side hair -->
  <path d="M65 75 Q70 85 75 95" fill="none" stroke="#696969" stroke-width="6" stroke-linecap="round">
    <animate attributeName="stroke" values="#696969;#808080;#696969" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;1,0;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M135 75 Q130 85 125 95" fill="none" stroke="#696969" stroke-width="6" stroke-linecap="round">
    <animate attributeName="stroke" values="#696969;#808080;#696969" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-1,0;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Mustache -->
  <ellipse cx="100" cy="105" rx="15" ry="4" fill="#696969">
    <animate attributeName="fill" values="#696969;#808080;#696969" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="15;16;15" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Beard -->
  <ellipse cx="100" cy="120" rx="20" ry="15" fill="#696969">
    <animate attributeName="fill" values="#696969;#808080;#696969" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="20;21;20" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="85" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;6;8" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="115" cy="85" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;6;8" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="85" cy="85" r="3" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="85" r="3" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Glasses -->
  <circle cx="85" cy="85" r="12" fill="none" stroke="#000000" stroke-width="2">
    <animate attributeName="stroke" values="#000000;#333333;#000000" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="85" r="12" fill="none" stroke="#000000" stroke-width="2">
    <animate attributeName="stroke" values="#000000;#333333;#000000" dur="6s" repeatCount="indefinite"/>
  </circle>
  <line x1="97" y1="85" x2="103" y2="85" stroke="#000000" stroke-width="2">
    <animate attributeName="stroke" values="#000000;#333333;#000000" dur="6s" repeatCount="indefinite"/>
  </line>
  
  <!-- Nose -->
  <polygon points="100,95 95,105 105,105" fill="#f4a460"/>
  
  <!-- Mouth -->
  <path d="M95 115 Q100 120 105 115" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Suit jacket -->
  <path d="M70 140 Q100 135 130 140 L135 190 Q100 185 65 190 Z" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Vest -->
  <path d="M80 150 Q100 145 120 150 L115 180 Q100 175 85 180 Z" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Tie -->
  <polygon points="100,155 95,175 105,175" fill="#8b0000">
    <animate attributeName="fill" values="#8b0000;#dc143c;#8b0000" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;1,0;0,0" dur="2s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- Shirt -->
  <rect x="85" y="175" width="30" height="15" fill="white"/>
  
  <!-- Cigar -->
  <rect x="120" y="110" width="15" height="3" rx="1" ry="1" fill="#8b4513"/>
  <ellipse cx="135" cy="111" rx="2" ry="1" fill="#654321"/>
  
  <!-- Smoke -->
  <path d="M137 111 Q140 105 143 100 Q146 95 149 90" fill="none" stroke="#d3d3d3" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;2,-2;0,0" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M139 108 Q142 102 145 97 Q148 92 151 87" fill="none" stroke="#d3d3d3" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-1,-3;0,0" dur="4.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Notebook -->
  <rect x="50" y="140" width="12" height="15" rx="1" ry="1" fill="#f5f5dc">
    <animate attributeName="fill" values="#f5f5dc;#ffffff;#f5f5dc" dur="4s" repeatCount="indefinite"/>
  </rect>
  <line x1="52" y1="145" x2="60" y2="145" stroke="#000000" stroke-width="0.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="52" y1="148" x2="60" y2="148" stroke="#000000" stroke-width="0.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </line>
  <line x1="52" y1="151" x2="60" y2="151" stroke="#000000" stroke-width="0.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Pen -->
  <rect x="48" y="135" width="1" height="10" fill="#000000">
    <animateTransform attributeName="transform" type="rotate" values="0 48 140;5 48 140;0 48 140;-5 48 140;0 48 140" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="48" cy="135" r="1" fill="#ffd700">
    <animate attributeName="fill" values="#ffd700;#ffff00;#ffd700" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 48 140;5 48 140;0 48 140;-5 48 140;0 48 140" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Couch -->
  <rect x="30" y="170" width="40" height="15" rx="5" ry="5" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="30" y="175" width="40" height="10" rx="3" ry="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Psychology symbols -->
  <text x="160" y="60" font-family="serif" font-size="12" fill="#8b4513" fill-opacity="0.6">
    <animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-3,2;0,0" dur="5s" repeatCount="indefinite"/>
    ψ
  </text>
  <circle cx="25" cy="90" r="8" fill="none" stroke="#2c3e50" stroke-width="1" stroke-opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="8;10;8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="20" y="95" font-family="serif" font-size="8" fill="#2c3e50" fill-opacity="0.6">
    <animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
    ID
  </text>
  <text x="170" y="120" font-family="serif" font-size="10" fill="#8b0000" fill-opacity="0.5">
    <animate attributeName="fill-opacity" values="0.2;0.7;0.2" dur="4.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;2,-1;0,0" dur="6s" repeatCount="indefinite"/>
    ∞
  </text>
  
  <!-- Dream bubbles -->
  <circle cx="40" cy="40" r="3" fill="#e6e6fa" fill-opacity="0.6">
    <animate attributeName="cy" values="40;30;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;4;3" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="50" r="2.5" fill="#e6e6fa" fill-opacity="0.6">
    <animate attributeName="cy" values="50;40;50" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.5;3.5;2.5" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="160" r="2" fill="#e6e6fa" fill-opacity="0.6">
    <animate attributeName="cy" values="160;150;160" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3;2" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Subconscious symbols -->
  <text x="170" y="170" font-family="serif" font-size="10" fill="#8b4513" fill-opacity="0.5">
    <animate attributeName="fill-opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 170 170;5 170 170;0 170 170;-5 170 170;0 170 170" dur="8s" repeatCount="indefinite"/>
    ☽
  </text>
  <text x="20" y="30" font-family="serif" font-size="8" fill="#2c3e50" fill-opacity="0.6">
    <animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;2,1;0,0" dur="6s" repeatCount="indefinite"/>
    EGO
  </text>
  <text x="160" y="180" font-family="serif" font-size="8" fill="#8b0000" fill-opacity="0.5">
    <animate attributeName="fill-opacity" values="0.2;0.7;0.2" dur="4.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-1,2;0,0" dur="7s" repeatCount="indefinite"/>
    SUPER
  </text>
  
  <!-- Thought waves -->
  <path d="M20 70 Q30 65 40 70 Q50 75 60 70" fill="none" stroke="#dda0dd" stroke-width="1" stroke-opacity="0.4">
    <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;3,0;0,0" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M140 180 Q150 175 160 180 Q170 185 180 180" fill="none" stroke="#dda0dd" stroke-width="1" stroke-opacity="0.4">
    <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,0;0,0" dur="4.5s" repeatCount="indefinite"/>
  </path>
</svg>