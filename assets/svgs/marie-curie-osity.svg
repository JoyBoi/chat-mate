<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0f0f23" stroke="#00ff88" stroke-width="3">
    <animate attributeName="fill" values="#0f0f23;#1a1a3a;#0f0f23" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00ff88;#00ffaa;#00ff88" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;4;3" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="30" ry="35" fill="#fdbcb4">
    <animate attributeName="fill" values="#fdbcb4;#ffcccb;#fdbcb4" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Hair (pulled back) -->
  <path d="M75 65 Q100 50 125 65 L120 80 Q100 65 80 80 Z" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="5s" repeatCount="indefinite"/>
  </path>
  <ellipse cx="100" cy="75" rx="25" ry="15" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Hair bun -->
  <circle cx="100" cy="60" r="8" fill="#654321">
    <animate attributeName="fill" values="#654321;#8b4513;#654321" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="8;8.5;8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Eyes -->
  <ellipse cx="90" cy="85" rx="5" ry="7" fill="white">
    <animate attributeName="ry" values="7;8;7" dur="3s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="110" cy="85" rx="5" ry="7" fill="white">
    <animate attributeName="ry" values="7;8;7" dur="3s" repeatCount="indefinite" begin="0.5s" />
  </ellipse>
  <circle cx="90" cy="85" r="3" fill="#2c3e50">
    <animate attributeName="r" values="3;3.5;3" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="110" cy="85" r="3" fill="#2c3e50">
    <animate attributeName="r" values="3;3.5;3" dur="2s" repeatCount="indefinite" begin="0.5s" />
  </circle>
  
  <!-- Eyebrows -->
  <path d="M82 78 L98 80" fill="none" stroke="#654321" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#654321;#8b4513;#654321" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;3;2" dur="1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M118 78 L102 80" fill="none" stroke="#654321" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#654321;#8b4513;#654321" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="stroke-width" values="2;3;2" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  
  <!-- Nose -->
  <polygon points="100,92 96,100 104,100" fill="#f4a460">
    <animate attributeName="fill" values="#f4a460;#daa520;#f4a460" dur="3s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- Mouth -->
  <path d="M94 105 Q100 108 106 105" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="d" values="M94 105 Q100 108 106 105;M94 105 Q100 110 106 105;M94 105 Q100 108 106 105" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Lab coat -->
  <path d="M75 115 Q100 110 125 115 L130 190 Q100 185 70 190 Z" fill="white">
    <animate attributeName="fill" values="white;#f8f8ff;white" dur="6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Dress underneath -->
  <path d="M85 125 Q100 120 115 125 L110 175 Q100 170 90 175 Z" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Collar -->
  <path d="M85 115 Q100 110 115 115 L110 125 Q100 120 90 125 Z" fill="white">
    <animate attributeName="fill" values="white;#f0f8ff;white" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Test tube with glowing substance -->
  <rect x="45" y="130" width="4" height="20" rx="2" ry="2" fill="#87ceeb">
    <animate attributeName="fill" values="#87ceeb;#b0e0e6;#87ceeb" dur="4s" repeatCount="indefinite" />
  </rect>
  <rect x="46" y="135" width="2" height="10" fill="#00ff88" opacity="0.8">
    <animate attributeName="fill" values="#00ff88;#00ffaa;#00ff88" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;1;0.6;0.8" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="height" values="10;12;9;10" dur="3s" repeatCount="indefinite" />
  </rect>
  <circle cx="47" cy="130" r="2" fill="#c0c0c0"/>
  
  <!-- Radium glow -->
  <circle cx="47" cy="140" r="8" fill="#00ff88" opacity="0.3">
    <animate attributeName="r" values="8;10;7;8" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.5;0.2;0.3" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#00ff88;#00ffaa;#00ff66;#00ff88" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="47" cy="140" r="12" fill="#00ff88" opacity="0.1">
    <animate attributeName="r" values="12;15;11;12" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.2;0.05;0.1" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Microscope -->
  <rect x="140" y="140" width="3" height="15" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="4s" repeatCount="indefinite" />
  </rect>
  <circle cx="141" cy="140" r="4" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="4;4.5;4" dur="2s" repeatCount="indefinite" />
  </circle>
  <rect x="138" y="155" width="7" height="3" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="4s" repeatCount="indefinite" begin="1s" />
  </rect>
  
  <!-- Periodic table elements -->
  <rect x="30" y="160" width="15" height="10" fill="#4169e1" opacity="0.7">
    <animate attributeName="fill" values="#4169e1;#6495ed;#4169e1" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
  </rect>
  <text x="32" y="167" font-family="Arial" font-size="8" fill="white">
    <animate attributeName="fill" values="white;#f0f8ff;white" dur="2.5s" repeatCount="indefinite" />
    Ra
  </text>
  
  <rect x="50" y="160" width="15" height="10" fill="#32cd32" opacity="0.7">
    <animate attributeName="fill" values="#32cd32;#90ee90;#32cd32" dur="3s" repeatCount="indefinite" begin="1s" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="1s" />
  </rect>
  <text x="53" y="167" font-family="Arial" font-size="8" fill="white">
    <animate attributeName="fill" values="white;#f0f8ff;white" dur="2.5s" repeatCount="indefinite" begin="1s" />
    Po
  </text>
  
  <!-- Radiation symbols -->
  <g transform="translate(160,120)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#ffff00" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite" />
      <animate attributeName="stroke" values="#ffff00;#ffd700;#ffff00" dur="1.5s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="4s" repeatCount="indefinite" />
    </circle>
    <path d="M0,-6 L-3,3 L3,3 Z" fill="#ffff00" opacity="0.6">
      <animate attributeName="fill" values="#ffff00;#ffd700;#ffff00" dur="1.5s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="4s" repeatCount="indefinite" />
    </path>
    <circle cx="0" cy="0" r="2" fill="#ffff00" opacity="0.6">
      <animate attributeName="fill" values="#ffff00;#ffd700;#ffff00" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Laboratory equipment -->
  <ellipse cx="120" cy="170" rx="8" ry="4" fill="#87ceeb">
    <animate attributeName="fill" values="#87ceeb;#b0e0e6;#87ceeb" dur="3s" repeatCount="indefinite" />
    <animate attributeName="rx" values="8;9;8" dur="2s" repeatCount="indefinite" />
    <animate attributeName="ry" values="4;5;4" dur="2.5s" repeatCount="indefinite" />
  </ellipse>
  <rect x="118" y="166" width="4" height="4" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite" />
  </rect>
  
  <!-- Glowing particles -->
  <circle cx="70" cy="100" r="1" fill="#00ff88" opacity="0.8">
    <animate attributeName="cy" values="100;95;100" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;1;0.4;0.8" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="1;1.5;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="130" cy="95" r="1" fill="#00ff88" opacity="0.6">
    <animate attributeName="cx" values="130;135;130" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.2;0.6" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="85" cy="70" r="1" fill="#00ff88" opacity="0.4">
    <animate attributeName="cy" values="70;65;70" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.8;0.1;0.4" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="115" cy="75" r="1" fill="#00ff88" opacity="0.7">
    <animate attributeName="cx" values="115;120;115" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.3;0.7" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="r" values="1;1.5;1" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Additional floating science particles -->
  <circle cx="25" cy="40" r="1.5" fill="#00ff88" opacity="0.5">
    <animate attributeName="cy" values="40;35;40" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.9;0.2;0.5" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="1.5;2;1.5" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="175" cy="50" r="1" fill="#00ff88" opacity="0.7">
    <animate attributeName="cx" values="175;180;175" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.3;0.7" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="70" cy="30" r="1" fill="#ffd700" opacity="0.6">
    <animate attributeName="cy" values="30;25;30" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.3;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="130" cy="35" r="1.5" fill="#87ceeb" opacity="0.5">
    <animate attributeName="cx" values="130;135;130" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.9;0.2;0.5" dur="2.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Floating science symbols -->
  <g>
    <text x="15" y="25" font-family="Arial" font-size="8" fill="#ffd700" opacity="0.7">⚛</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.4;0.7" dur="3s" repeatCount="indefinite" />
  </g>
  
  <g>
    <text x="180" y="30" font-family="Arial" font-size="6" fill="#00ff88" opacity="0.6">E=mc²</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;-3,0;0,0" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.3;0.6" dur="4s" repeatCount="indefinite" />
  </g>
  
  <!-- Nobel Prize medal -->
  <circle cx="35" cy="180" r="6" fill="#ffd700">
    <animate attributeName="fill" values="#ffd700;#ffff00;#ffd700" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="6;7;6" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="0 35 180;360 35 180" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="32" y="183" font-family="Arial" font-size="6" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="2.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="0 35 180;360 35 180" dur="8s" repeatCount="indefinite" />
    N
  </text>
  
  <!-- Scientific discovery aura -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.2">
    <animate attributeName="r" values="80;85;80" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00ff88;#00ffaa;#00ff88" dur="9s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Laboratory atmosphere waves -->
  <path d="M 10 50 Q 100 40 190 50" stroke="#00ff88" stroke-width="0.5" fill="none" stroke-opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="d" values="M 10 50 Q 100 40 190 50;M 10 55 Q 100 45 190 55;M 10 50 Q 100 40 190 50" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 15 150 Q 100 140 185 150" stroke="#ffd700" stroke-width="0.5" fill="none" stroke-opacity="0.2">
    <animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="d" values="M 15 150 Q 100 140 185 150;M 15 145 Q 100 135 185 145;M 15 150 Q 100 140 185 150" dur="2.5s" repeatCount="indefinite"/>
  </path>
</svg>