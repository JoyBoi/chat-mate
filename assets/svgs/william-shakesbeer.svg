<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f5f5dc" stroke="#8b4513" stroke-width="3"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="32" ry="38" fill="#fdbcb4"/>
  
  <!-- Balding head with hair on sides -->
  <path d="M70 65 Q100 50 130 65 L125 75 Q100 60 75 75 Z" fill="#fdbcb4"/>
  
  <!-- Side hair -->
  <path d="M68 75 Q65 85 70 95 Q75 100 80 95" fill="#8b4513"/>
  <path d="M132 75 Q135 85 130 95 Q125 100 120 95" fill="#8b4513"/>
  
  <!-- Mustache -->
  <ellipse cx="100" cy="105" rx="12" ry="3" fill="#8b4513"/>
  
  <!-- Goatee -->
  <ellipse cx="100" cy="118" rx="8" ry="10" fill="#8b4513"/>
  
  <!-- Eyes -->
  <ellipse cx="88" cy="85" rx="6" ry="8" fill="white"/>
  <ellipse cx="112" cy="85" rx="6" ry="8" fill="white"/>
  <circle cx="88" cy="85" r="3" fill="#2c3e50"/>
  <circle cx="112" cy="85" r="3" fill="#2c3e50"/>
  
  <!-- Eyebrows -->
  <path d="M80 78 L96 80" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  <path d="M120 78 L104 80" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Nose -->
  <polygon points="100,95 95,105 105,105" fill="#f4a460"/>
  
  <!-- Mouth -->
  <path d="M92 115 Q100 120 108 115" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Elizabethan collar/ruff -->
  <ellipse cx="100" cy="130" rx="40" ry="15" fill="white"/>
  <path d="M60 130 Q70 125 80 130 Q90 135 100 130 Q110 135 120 130 Q130 125 140 130" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Doublet -->
  <path d="M75 145 Q100 140 125 145 L130 190 Q100 185 70 190 Z" fill="#2c3e50"/>
  
  <!-- Doublet buttons -->
  <circle cx="100" cy="155" r="2" fill="#daa520"/>
  <circle cx="100" cy="165" r="2" fill="#daa520"/>
  <circle cx="100" cy="175" r="2" fill="#daa520"/>
  
  <!-- Beer mug -->
  <rect x="40" y="140" width="12" height="18" rx="2" ry="2" fill="#daa520"/>
  <rect x="42" y="145" width="8" height="10" fill="#ffb347"/>
  <ellipse cx="46" cy="145" rx="4" ry="2" fill="#ffffff" opacity="0.8"/>
  <rect x="52" y="148" width="4" height="6" rx="2" ry="2" fill="#8b4513"/>
  
  <!-- Beer foam -->
  <ellipse cx="46" cy="142" rx="6" ry="3" fill="#ffffff"/>
  <circle cx="42" cy="140" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="50" cy="139" r="1" fill="#ffffff" opacity="0.8"/>
  
  <!-- Quill pen -->
  <path d="M140 130 Q145 125 150 130 Q148 140 145 145" fill="#8b4513"/>
  <path d="M140 130 Q135 125 130 130" fill="none" stroke="#654321" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Scroll/manuscript -->
  <rect x="130" y="150" width="20" height="15" rx="2" ry="2" fill="#f5deb3"/>
  <line x1="133" y1="155" x2="147" y2="155" stroke="#8b4513" stroke-width="0.5"/>
  <line x1="133" y1="158" x2="147" y2="158" stroke="#8b4513" stroke-width="0.5"/>
  <line x1="133" y1="161" x2="147" y2="161" stroke="#8b4513" stroke-width="0.5"/>
  
  <!-- Theater masks -->
  <g transform="translate(30,170)">
    <!-- Comedy mask -->
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <circle cx="-3" cy="-3" r="1" fill="#000000"/>
    <circle cx="3" cy="-3" r="1" fill="#000000"/>
    <path d="M-4,4 Q0,8 4,4" fill="none" stroke="#000000" stroke-width="1"/>
  </g>
  
  <g transform="translate(50,170)">
    <!-- Tragedy mask -->
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <circle cx="-3" cy="-3" r="1" fill="#000000"/>
    <circle cx="3" cy="-3" r="1" fill="#000000"/>
    <path d="M-4,6 Q0,2 4,6" fill="none" stroke="#000000" stroke-width="1"/>
  </g>
  
  <!-- Stage -->
  <rect x="150" y="170" width="25" height="3" fill="#8b4513"/>
  <rect x="155" y="173" width="3" height="8" fill="#654321"/>
  <rect x="167" y="173" width="3" height="8" fill="#654321"/>
  
  <!-- Curtains -->
  <path d="M150 165 Q155 160 160 165 Q165 170 170 165 Q175 160 180 165" fill="none" stroke="#8b0000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Hops (beer ingredient) -->
  <ellipse cx="160" cy="140" rx="4" ry="6" fill="#228b22"/>
  <path d="M160 134 L160 128" fill="none" stroke="#654321" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Barley -->
  <path d="M170 135 Q175 130 180 135" fill="none" stroke="#daa520" stroke-width="2" stroke-linecap="round"/>
  <circle cx="172" cy="133" r="1" fill="#daa520"/>
  <circle cx="175" cy="131" r="1" fill="#daa520"/>
  <circle cx="178" cy="133" r="1" fill="#daa520"/>
</svg>