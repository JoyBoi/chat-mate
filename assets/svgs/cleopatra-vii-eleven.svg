<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f4e4bc" stroke="#daa520" stroke-width="3">
    <animate attributeName="fill" values="#f4e4bc;#ffeaa7;#f4e4bc" dur="8s" repeatCount="indefinite" />
  </circle>
  
  <!-- Subtle desert ambiance -->
  <circle cx="160" cy="50" r="1" fill="#daa520" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="30" ry="35" fill="#deb887"/>
  
  <!-- Egyptian headdress -->
  <path d="M70 60 Q100 45 130 60 L135 80 Q100 65 65 80 Z" fill="#4169e1">
    <animate attributeName="fill" values="#4169e1;#6495ed;#4169e1" dur="6s" repeatCount="indefinite" />
  </path>
  <rect x="65" y="80" width="70" height="10" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="4s" repeatCount="indefinite" />
  </rect>
  
  <!-- Headdress stripes -->
  <rect x="70" y="60" width="60" height="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite" />
  </rect>
  <rect x="70" y="67" width="60" height="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="4s" repeatCount="indefinite" begin="0.5s" />
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite" begin="0.5s" />
  </rect>
  <rect x="70" y="74" width="60" height="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="4s" repeatCount="indefinite" begin="1s" />
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite" begin="1s" />
  </rect>
  
  <!-- Animated cobra on headdress -->
  <path d="M100 55 Q105 45 110 55 Q105 50 100 55" fill="#ffd700">
    <animate attributeName="fill" values="#ffd700;#ffff00;#ffd700;#daa520;#ffd700" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1;1.05;1" dur="4s" repeatCount="indefinite" additive="sum" />
  </path>
  <circle cx="105" cy="50" r="1" fill="#8b0000">
    <animate attributeName="fill" values="#8b0000;#ff0000;#8b0000;#dc143c;#8b0000" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="1;1.5;1;1.2;1" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Animated eyes with kohl -->
  <ellipse cx="88" cy="85" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;2;8" dur="5s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="112" cy="85" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;2;8" dur="5s" repeatCount="indefinite" />
  </ellipse>
  <circle cx="88" cy="85" r="3" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#4169e1;#2c3e50" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="112" cy="85" r="3" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#4169e1;#2c3e50" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Kohl eyeliner -->
  <path d="M78 85 L94 85" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#000000;#2c3e50;#000000" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="2;2.5;2" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M122 85 L106 85" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#000000;#2c3e50;#000000" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="2;2.5;2" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M94 85 L98 80" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#000000;#2c3e50;#000000" dur="3s" repeatCount="indefinite" />
  </path>
  <path d="M106 85 L102 80" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#000000;#2c3e50;#000000" dur="3s" repeatCount="indefinite" />
  </path>
  
  <!-- Eyebrows -->
  <path d="M80 75 L96 78" fill="none" stroke="#654321" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#654321;#8b4513;#654321" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M120 75 L104 78" fill="none" stroke="#654321" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#654321;#8b4513;#654321" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="2s" repeatCount="indefinite" />
  </path>
  
  <!-- Nose -->
  <polygon points="100,95 96,105 104,105" fill="#cd853f"/>
  
  <!-- Mouth -->
  <path d="M92 110 Q100 115 108 110" fill="none" stroke="#8b0000" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#8b0000;#dc143c;#8b0000" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,1;0,-1;0,0" dur="2.5s" repeatCount="indefinite" />
  </path>
  
  <!-- Animated Egyptian collar/necklace -->
  <path d="M75 120 Q100 115 125 120 L120 135 Q100 130 80 135 Z" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520;#ffff00;#daa520" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.8;1;0.9;1" dur="3s" repeatCount="indefinite" />
  </path>
  <rect x="80" y="125" width="40" height="3" fill="#4169e1">
    <animate attributeName="fill" values="#4169e1;#6495ed;#4169e1;#0000ff;#4169e1" dur="5s" repeatCount="indefinite" />
  </rect>
  <rect x="80" y="130" width="40" height="3" fill="#8b0000">
    <animate attributeName="fill" values="#8b0000;#dc143c;#8b0000;#ff0000;#8b0000" dur="5s" repeatCount="indefinite" />
  </rect>
  
  <!-- Royal dress -->
  <path d="M70 140 Q100 135 130 140 L135 190 Q100 185 65 190 Z" fill="#4169e1">
    <animate attributeName="fill" values="#4169e1;#6495ed;#4169e1" dur="5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;1,0;-1,0;0,0" dur="4s" repeatCount="indefinite" />
  </path>
  
  <!-- Animated gold trim -->
  <rect x="70" y="140" width="60" height="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520;#ffff00;#daa520" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.8;1;0.9;1" dur="3s" repeatCount="indefinite" />
  </rect>
  <rect x="70" y="170" width="60" height="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520;#ffff00;#daa520" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.8;1;0.9;1" dur="3s" repeatCount="indefinite" />
  </rect>
  

  

  

  
  <!-- Animated ankh -->
  <circle cx="40" cy="60" r="4" fill="none" stroke="#daa520" stroke-width="2">
    <animate attributeName="stroke" values="#daa520;#ffd700;#daa520;#ffff00;#daa520" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="4;5;4;4.5;4" dur="4s" repeatCount="indefinite" />
  </circle>
  <path d="M40 64 L40 80" fill="none" stroke="#daa520" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#daa520;#ffd700;#daa520;#ffff00;#daa520" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.7;1;0.8;1" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M32 72 L48 72" fill="none" stroke="#daa520" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#daa520;#ffd700;#daa520;#ffff00;#daa520" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.7;1;0.8;1" dur="2s" repeatCount="indefinite" />
  </path>
  

  
  <!-- Animated Egyptian cat -->
  <ellipse cx="30" cy="140" rx="8" ry="12" fill="#2c3e50">
    <animateTransform attributeName="transform" type="rotate" values="0 30 140;2 30 140;-2 30 140;0 30 140" dur="4s" repeatCount="indefinite" />
  </ellipse>
  <circle cx="30" cy="135" r="5" fill="#2c3e50">
    <animateTransform attributeName="transform" type="rotate" values="0 30 140;2 30 140;-2 30 140;0 30 140" dur="4s" repeatCount="indefinite" />
  </circle>
  <polygon points="25,130 27,125 29,130" fill="#2c3e50">
    <animateTransform attributeName="transform" type="rotate" values="0 30 140;2 30 140;-2 30 140;0 30 140" dur="4s" repeatCount="indefinite" />
  </polygon>
  <polygon points="35,130 33,125 31,130" fill="#2c3e50">
    <animateTransform attributeName="transform" type="rotate" values="0 30 140;2 30 140;-2 30 140;0 30 140" dur="4s" repeatCount="indefinite" />
  </polygon>
  <circle cx="28" cy="133" r="1" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#32cd32;#00ff00;#7fff00;#00ff00" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="1;1.5;1;1.2;1" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="0 30 140;2 30 140;-2 30 140;0 30 140" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="32" cy="133" r="1" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#32cd32;#00ff00;#7fff00;#00ff00" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="1;1.5;1;1.2;1" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="0 30 140;2 30 140;-2 30 140;0 30 140" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Convenience store items -->
  <rect x="45" y="175" width="6" height="10" fill="#ff6347">
    <animate attributeName="fill" values="#ff6347;#ff4500;#ff6347;#dc143c;#ff6347" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1;1.02;1" dur="1.5s" repeatCount="indefinite" additive="sum"/>
  </rect>
  <text x="46" y="182" font-family="Arial" font-size="6" fill="white">
    <animate attributeName="fill" values="white;#ffff00;white;#ffd700;white" dur="2s" repeatCount="indefinite"/>
    HOT
  </text>
  
  <rect x="70" y="175" width="6" height="10" fill="#4169e1">
    <animate attributeName="fill" values="#4169e1;#0000ff;#4169e1;#6495ed;#4169e1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1;1.02;1" dur="1.5s" repeatCount="indefinite" begin="0.5s" additive="sum"/>
  </rect>
  <text x="71" y="182" font-family="Arial" font-size="6" fill="white">
    <animate attributeName="fill" values="white;#e0ffff;white;#b0e0e6;white" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    ICE
  </text>
  
  <!-- Animated convenience store aura -->
  <circle cx="57" cy="180" r="15" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="15;18;12;15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#ffd700;#ff6347;#4169e1;#ffd700" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Animated pyramid -->
  <polygon points="20,200 35,180 50,200" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520;#ffff00;#daa520" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="scale" values="1;1.02;1;1.01;1" dur="3s" repeatCount="indefinite" additive="sum" />
  </polygon>
  <polygon points="35,180 50,200 65,180" fill="#b8860b">
    <animate attributeName="fill" values="#b8860b;#daa520;#b8860b;#ffd700;#b8860b" dur="4s" repeatCount="indefinite" begin="0.5s" />
    <animateTransform attributeName="transform" type="scale" values="1;1.02;1;1.01;1" dur="3s" repeatCount="indefinite" begin="0.5s" additive="sum" />
  </polygon>
  
  <!-- Animated scarab beetle -->
  <ellipse cx="150" cy="170" rx="6" ry="4" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#4169e1;#2c3e50;#6495ed;#2c3e50" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,0;2,0;0,0" dur="1.5s" repeatCount="indefinite" additive="sum" />
  </ellipse>
  <circle cx="150" cy="170" r="2" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520;#ffff00;#daa520" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;2.5;2;2.2;2" dur="1.8s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,0;2,0;0,0" dur="1.5s" repeatCount="indefinite" additive="sum" />
  </circle>
  
  <!-- Animated papyrus scroll -->
  <rect x="120" y="175" width="25" height="15" fill="#f5deb3">
    <animate attributeName="fill" values="#f5deb3;#daa520;#f5deb3;#ffd700;#f5deb3" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.8;1;0.9;1" dur="2.5s" repeatCount="indefinite" />
  </rect>
  <path d="M122 177 Q130 175 138 177 M122 180 Q130 178 138 180 M122 183 Q130 181 138 183" fill="none" stroke="#8b4513" stroke-width="1">
    <animate attributeName="stroke" values="#8b4513;#daa520;#8b4513;#b8860b;#8b4513" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.7;1;0.8;1" dur="2s" repeatCount="indefinite" />
  </path>
  
  <!-- Animated Nile river waves -->
  <path d="M10 210 Q30 205 50 210 T90 210" fill="none" stroke="#4169e1" stroke-width="3">
    <animate attributeName="stroke" values="#4169e1;#6495ed;#4169e1;#0000ff;#4169e1" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,1;0,0" dur="1.5s" repeatCount="indefinite" additive="sum" />
  </path>
  <path d="M90 210 Q110 205 130 210 T170 210" fill="none" stroke="#4169e1" stroke-width="3">
    <animate attributeName="stroke" values="#4169e1;#6495ed;#4169e1;#0000ff;#4169e1" dur="2s" repeatCount="indefinite" begin="0.3s" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,1;0,-1;0,0" dur="1.8s" repeatCount="indefinite" begin="0.3s" additive="sum" />
  </path>
  
  <!-- Animated lotus flower -->
  <ellipse cx="120" cy="205" rx="4" ry="2" fill="#ff69b4">
    <animate attributeName="fill" values="#ff69b4;#ff1493;#ff69b4;#da70d6;#ff69b4" dur="3s" repeatCount="indefinite" />
    <animate attributeName="ry" values="2;3;2;2.5;2" dur="2.5s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="120" cy="205" rx="2" ry="4" fill="#ff69b4">
    <animate attributeName="fill" values="#ff69b4;#ff1493;#ff69b4;#da70d6;#ff69b4" dur="3s" repeatCount="indefinite" begin="0.5s" />
    <animate attributeName="rx" values="2;3;2;2.5;2" dur="2.5s" repeatCount="indefinite" begin="0.5s" />
  </ellipse>
  <circle cx="120" cy="205" r="1" fill="#ffd700">
    <animate attributeName="fill" values="#ffd700;#ffff00;#ffd700;#daa520;#ffd700" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="1;1.5;1;1.2;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  
  <!-- Animated Egyptian sun disk -->
  <circle cx="180" cy="30" r="8" fill="#ffd700">
    <animate attributeName="fill" values="#ffd700;#ffff00;#ffd700;#daa520;#ffd700" dur="4s" repeatCount="indefinite" />
    <animate attributeName="r" values="8;9;8;8.5;8" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.8;1;0.9;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <path d="M180 22 L180 18 M188 30 L192 30 M180 38 L180 42 M172 30 L168 30 M185 25 L188 22 M185 35 L188 38 M175 25 L172 22 M175 35 L172 38" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#ffd700;#ffff00;#ffd700;#daa520;#ffd700" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="0 180 30;360 180 30" dur="8s" repeatCount="indefinite" />
  </path>
</svg>