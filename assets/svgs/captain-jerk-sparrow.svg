<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#87ceeb" stroke="#4682b4" stroke-width="3">
    <animate attributeName="fill" values="#87ceeb;#6495ed;#87ceeb" dur="8s" repeatCount="indefinite" />
  </circle>
  
  <!-- Ocean waves -->
  <path d="M30 180 Q40 175 50 180 Q60 185 70 180 Q80 175 90 180 Q100 185 110 180 Q120 175 130 180 Q140 185 150 180 Q160 175 170 180" fill="none" stroke="#4682b4" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M30 180 Q40 175 50 180 Q60 185 70 180 Q80 175 90 180 Q100 185 110 180 Q120 175 130 180 Q140 185 150 180 Q160 175 170 180;M30 180 Q40 185 50 180 Q60 175 70 180 Q80 185 90 180 Q100 175 110 180 Q120 185 130 180 Q140 175 150 180 Q160 185 170 180;M30 180 Q40 175 50 180 Q60 185 70 180 Q80 175 90 180 Q100 185 110 180 Q120 175 130 180 Q140 185 150 180 Q160 175 170 180" dur="4s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#4682b4;#1e90ff;#4682b4" dur="3s" repeatCount="indefinite" />
  </path>
  
  <!-- Animated bandana -->
  <path d="M65 65 Q100 50 135 65 L140 85 Q100 70 60 85 Z" fill="#8b0000">
    <animate attributeName="fill" values="#8b0000;#a52a2a;#8b0000;#dc143c;#8b0000" dur="6s" repeatCount="indefinite" />
  </path>
  <path d="M60 85 Q100 75 140 85 L135 95 Q100 85 65 95 Z" fill="#a0522d">
    <animate attributeName="fill" values="#a0522d;#cd853f;#a0522d;#daa520;#a0522d" dur="6s" repeatCount="indefinite" />
  </path>
  
  <!-- Pirate sparkles -->
  <circle cx="85" cy="75" r="1" fill="#ffd700" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.9;0.3;0.8" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;-1,-2;1,-1;0,-3;0,0" dur="3s" repeatCount="indefinite" additive="sum" />
  </circle>
  <circle cx="115" cy="80" r="1.5" fill="#ff6347" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.8;0.2;0.7" dur="2.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;2,-1;-1,-2;1,-3;0,0" dur="3.5s" repeatCount="indefinite" additive="sum" />
  </circle>
  
  <!-- Animated hair -->
  <path d="M65 95 Q70 110 75 125" fill="none" stroke="#654321" stroke-width="8" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 65 95;2 65 95;-2 65 95;0 65 95" dur="4s" repeatCount="indefinite" />
  </path>
  <path d="M135 95 Q130 110 125 125" fill="none" stroke="#654321" stroke-width="8" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 135 95;-2 135 95;2 135 95;0 135 95" dur="4.5s" repeatCount="indefinite" />
  </path>
  
  <!-- Face -->
  <ellipse cx="100" cy="110" rx="35" ry="40" fill="#deb887"/>
  
  <!-- Animated eyes -->
  <ellipse cx="90" cy="105" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;2;8" dur="5s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="110" cy="105" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;2;8" dur="4s" repeatCount="indefinite" />
  </ellipse>
  <circle cx="90" cy="105" r="3" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#8b0000;#2c3e50" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="110" cy="105" r="3" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#8b0000;#2c3e50" dur="6s" repeatCount="indefinite" />
  </circle>
  
  <!-- Eye patch -->
  <circle cx="90" cy="105" r="10" fill="#000000">
    <animate attributeName="fill" values="#000000;#1a1a1a;#000000" dur="3s" repeatCount="indefinite" />
  </circle>
  <line x1="80" y1="95" x2="100" y2="115" stroke="#654321" stroke-width="2">
    <animate attributeName="stroke" values="#654321;#8b4513;#654321" dur="4s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="2;2.5;2" dur="2s" repeatCount="indefinite" />
  </line>
  
  <!-- Mustache -->
  <path d="M85 120 Q100 125 115 120" fill="none" stroke="#654321" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke-width" values="4;5;3;4" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#654321;#8b4513;#654321" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,1;0,0" dur="2s" repeatCount="indefinite" />
  </path>
  
  <!-- Goatee -->
  <ellipse cx="100" cy="135" rx="8" ry="12" fill="#654321">
    <animate attributeName="ry" values="12;13;11;12" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#654321;#8b4513;#654321" dur="4s" repeatCount="indefinite" />
  </ellipse>
  
  <!-- Nose -->
  <polygon points="100,115 95,125 105,125" fill="#cd853f"/>
  
  <!-- Mouth -->
  <path d="M95 130 Q100 135 105 130" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#8b4513;#a0522d;#8b4513" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,1;0,-1;0,0" dur="2.5s" repeatCount="indefinite" />
  </path>
  
  <!-- Hat -->
  <path d="M70 70 Q100 55 130 70 L125 80 Q100 65 75 80 Z" fill="#2f4f4f">
    <animate attributeName="fill" values="#2f4f4f;#4682b4;#2f4f4f" dur="5s" repeatCount="indefinite" />
  </path>
  <ellipse cx="100" cy="70" rx="30" ry="8" fill="#696969">
    <animate attributeName="fill" values="#696969;#808080;#696969" dur="4s" repeatCount="indefinite" />
    <animate attributeName="ry" values="8;9;7;8" dur="3s" repeatCount="indefinite" />
  </ellipse>
  
  <!-- Animated feather -->
  <path d="M120 65 Q125 50 130 35" fill="none" stroke="#ff6347" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 120 65;5 120 65;-5 120 65;0 120 65" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#ff6347;#ff4500;#ff6347;#dc143c;#ff6347" dur="4s" repeatCount="indefinite" />
  </path>
  
  <!-- Coat -->
  <path d="M70 150 Q100 145 130 150 L135 190 Q100 185 65 190 Z" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;1,0;-1,0;0,0" dur="3s" repeatCount="indefinite" />
  </path>
  
  <!-- Vest -->
  <path d="M80 160 Q100 155 120 160 L115 180 Q100 175 85 180 Z" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="3s" repeatCount="indefinite" />
  </path>
  
  <!-- Shirt -->
  <rect x="85" y="170" width="30" height="15" fill="white">
    <animate attributeName="fill" values="white;#f5f5f5;white" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.9;1" dur="3s" repeatCount="indefinite" />
  </rect>
  
  <!-- Animated compass -->
  <circle cx="75" cy="165" r="8" fill="#ffd700">
    <animate attributeName="fill" values="#ffd700;#ffff00;#ffd700;#daa520;#ffd700" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="75" cy="165" r="5" fill="white">
    <animate attributeName="opacity" values="1;0.8;1;0.9;1" dur="3s" repeatCount="indefinite" />
  </circle>
  <line x1="75" y1="160" x2="75" y2="170" stroke="#ff0000" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 75 165;90 75 165;180 75 165;270 75 165;360 75 165" dur="8s" repeatCount="indefinite" />
  </line>
  <line x1="70" y1="165" x2="80" y2="165" stroke="#ff0000" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 75 165;90 75 165;180 75 165;270 75 165;360 75 165" dur="8s" repeatCount="indefinite" />
  </line>
  
  <!-- Animated sword -->
  <rect x="125" y="140" width="3" height="25" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#ffffff;#c0c0c0;#e6e6fa;#c0c0c0" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.7;1;0.8;1" dur="1.5s" repeatCount="indefinite" />
  </rect>
  <rect x="120" y="165" width="13" height="5" rx="2" ry="2" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513;#654321;#8b4513" dur="4s" repeatCount="indefinite" />
  </rect>
  
  <!-- Sword glint effect -->
  <line x1="125" y1="142" x2="128" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.9;0.1;0.8" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,5;0,10;0,15;0,20" dur="3s" repeatCount="indefinite" />
  </line>
  
  <!-- Parrot -->
  <ellipse cx="140" cy="90" rx="8" ry="6" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ff4500;#ff0000" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="0 140 90;5 140 90;-5 140 90;0 140 90" dur="2s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="145" cy="87" rx="4" ry="3" fill="#ffd700">
    <animate attributeName="fill" values="#ffd700;#ffff00;#ffd700" dur="3s" repeatCount="indefinite" />
  </ellipse>
  <circle cx="143" cy="86" r="1" fill="#000000"/>
  
  <!-- Floating pirate symbols -->
  <text x="40" y="50" font-size="10" fill="#ffd700" opacity="0.8">☠️
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;2,-2;0,-4;-2,-2;0,0" dur="5s" repeatCount="indefinite" />
  </text>
  <text x="150" y="40" font-size="10" fill="#ffd700" opacity="0.7">⚓
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,-3;-4,0;-2,3;0,0" dur="4.5s" repeatCount="indefinite" />
  </text>
  
  <!-- Gold coins -->
  <circle cx="45" cy="160" r="3" fill="#ffd700" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;2,1;0,2;-2,1;0,0" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="165" r="2" fill="#ffd700" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;-1,2;0,4;1,2;0,0" dur="3.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Treasure map -->
  <rect x="30" y="130" width="25" height="20" rx="2" ry="2" fill="#f5deb3" stroke="#8b4513" stroke-width="1">
    <animate attributeName="fill" values="#f5deb3;#f8f0e3;#f5deb3" dur="4s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="0 42.5 140;2 42.5 140;-2 42.5 140;0 42.5 140" dur="5s" repeatCount="indefinite" />
  </rect>
  <path d="M35 135 C40 138 45 135 50 138" fill="none" stroke="#8b0000" stroke-width="0.8" stroke-dasharray="1,1">
    <animate attributeName="stroke" values="#8b0000;#a52a2a;#8b0000" dur="3s" repeatCount="indefinite" />
  </path>
  <text x="47" y="145" font-size="6" fill="#8b0000" opacity="0.9">X
    <animate attributeName="fill" values="#8b0000;#ff0000;#8b0000" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.5s" repeatCount="indefinite" />
  </text>
  
  <!-- Rum bottle -->
  <rect x="160" y="150" width="8" height="15" rx="1" ry="1" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="4s" repeatCount="indefinite" />
  </rect>
  <rect x="162" y="147" width="4" height="3" fill="#a0522d">
    <animate attributeName="fill" values="#a0522d;#cd853f;#a0522d" dur="3s" repeatCount="indefinite" />
  </rect>
  <rect x="161" y="152" width="6" height="10" fill="#ffcc99" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="2s" repeatCount="indefinite" />
    <animate attributeName="height" values="10;9;10" dur="3s" repeatCount="indefinite" />
  </rect>
  
  <!-- Water splashes -->
  <path d="M20 175 Q25 170 30 175" fill="none" stroke="#4682b4" stroke-width="2" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#4682b4;#87ceeb;#4682b4" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;5,0;10,0;15,0;20,0" dur="4s" repeatCount="indefinite" />
  </path>
  <path d="M170 185 Q175 180 180 185" fill="none" stroke="#4682b4" stroke-width="2" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#4682b4;#87ceeb;#4682b4" dur="2.2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;-5,0;-10,0;-15,0;-20,0" dur="4.5s" repeatCount="indefinite" />
  </path>
  
  <!-- Animated speech bubble -->
  <path d="M130 70 Q140 60 150 65 Q160 60 155 75 Q160 85 150 85 Q140 90 135 80 Q125 85 130 70" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="5s" repeatCount="indefinite" />
    <animate attributeName="fill" values="white;#f8f8ff;white" dur="3s" repeatCount="indefinite" />
  </path>
  <text x="140" y="77" font-size="6" fill="#000000" opacity="0.9">Jerk!
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="5s" repeatCount="indefinite" />
  </text>
  
  <!-- Ship's wheel -->
  <circle cx="160" cy="120" r="12" fill="none" stroke="#8b4513" stroke-width="2">
    <animate attributeName="stroke" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 160 120;15 160 120;-15 160 120;0 160 120" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="120" r="6" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M160 108 L160 132 M148 120 L172 120 M152 112 L168 128 M152 128 L168 112" stroke="#8b4513" stroke-width="2">
    <animate attributeName="stroke" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 160 120;15 160 120;-15 160 120;0 160 120" dur="6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Treasure chest -->
  <rect x="20" y="150" width="20" height="12" fill="#8b4513" rx="2" ry="2">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="4s" repeatCount="indefinite"/>
  </rect>
  <path d="M20 155 L40 155" stroke="#ffd700" stroke-width="1">
    <animate attributeName="stroke" values="#ffd700;#ffff00;#ffd700" dur="2s" repeatCount="indefinite"/>
  </path>
  <rect x="28" y="153" width="4" height="4" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="25" cy="158" r="1.5" fill="#ffd700">
    <animate attributeName="fill" values="#ffd700;#ffff00;#ffd700" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;2;1.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="35" cy="158" r="1.5" fill="#ffd700">
    <animate attributeName="fill" values="#ffd700;#ffff00;#ffd700" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="r" values="1.5;2;1.5" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <!-- Cannon -->
  <rect x="175" cy="140" width="15" height="8" fill="#2f4f4f" rx="1" ry="1">
    <animate attributeName="fill" values="#2f4f4f;#4b6b6b;#2f4f4f" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="175" y="138" width="15" height="12" fill="#000000" rx="2" ry="6">
    <animate attributeName="fill" values="#000000;#1a1a1a;#000000" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="185" cy="144" r="3" fill="#000000">
    <animate attributeName="fill" values="#000000;#1a1a1a;#000000" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="144" r="0" fill="#ff4500" opacity="0">
    <animate attributeName="r" values="0;3;0" dur="1.5s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" repeatCount="indefinite" begin="3s"/>
  </circle>
  
  <!-- Pirate flag -->
  <rect x="60" y="30" width="15" height="10" fill="#000000">
    <animate attributeName="fill" values="#000000;#1a1a1a;#000000" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="skewX" values="0;2;0;-2;0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="63" y="38" font-size="8" fill="#ffffff" opacity="0.9">☠
    <animate attributeName="opacity" values="0.9;0.7;0.9" dur="2s" repeatCount="indefinite"/>
  </text>
  <line x1="60" y1="30" x2="60" y2="50" stroke="#8b4513" stroke-width="1.5">
    <animate attributeName="stroke" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>