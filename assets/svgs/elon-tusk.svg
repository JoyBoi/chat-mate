<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#e6f7ff" stroke="#1da1f2" stroke-width="3">
    <animate attributeName="fill" values="#e6f7ff;#f0f8ff;#e6f7ff" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#1da1f2;#4fc3f7;#1da1f2" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="35" ry="40" fill="#fdbcb4">
    <animate attributeName="fill" values="#fdbcb4;#ffcccb;#fdbcb4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Hair -->
  <path d="M70 60 Q100 45 130 60 L125 70 Q100 55 75 70 Z" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M70 60 Q75 50 80 60" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke" values="#2c3e50;#34495e;#2c3e50" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M90 55 Q95 45 100 55" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke" values="#2c3e50;#34495e;#2c3e50" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M110 55 Q115 45 120 55" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke" values="#2c3e50;#34495e;#2c3e50" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="85" rx="6" ry="8" fill="#ffffff">
    <animate attributeName="ry" values="8;6;8" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="115" cy="85" rx="6" ry="8" fill="#ffffff">
    <animate attributeName="ry" values="8;6;8" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="85" cy="85" r="3" fill="#2c3e50">
    <animate attributeName="r" values="3;2.5;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="85" r="3" fill="#2c3e50">
    <animate attributeName="r" values="3;2.5;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Eyebrows -->
  <path d="M75 75 L95 78" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#2c3e50;#34495e;#2c3e50" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M125 75 L105 78" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#2c3e50;#34495e;#2c3e50" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Nose -->
  <polygon points="100,95 95,105 105,105" fill="#f4a460"/>
  
  <!-- Trunk -->
  <ellipse cx="100" cy="110" rx="8" ry="15" fill="#fdbcb4">
    <animate attributeName="fill" values="#fdbcb4;#ffcccb;#fdbcb4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="100" cy="125" rx="6" ry="10" fill="#fdbcb4">
    <animate attributeName="fill" values="#fdbcb4;#ffcccb;#fdbcb4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Mouth -->
  <path d="M90 110 Q100 115 110 110" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="100" cy="105" rx="3" ry="2" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Tusks -->
  <path d="M85 110 Q80 100 75 105" fill="none" stroke="#f5f5f5" stroke-width="5" stroke-linecap="round">
    <animate attributeName="stroke" values="#f5f5f5;#ffffff;#f5f5f5" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M115 110 Q120 100 125 105" fill="none" stroke="#f5f5f5" stroke-width="5" stroke-linecap="round">
    <animate attributeName="stroke" values="#f5f5f5;#ffffff;#f5f5f5" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Business suit -->
  <path d="M70 130 Q100 125 130 130 L135 190 Q100 185 65 190 Z" fill="#2c3e50"/>
  <rect x="70" y="140" width="60" height="60" fill="#2c3e50" rx="5">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Shirt -->
  <path d="M85 130 Q100 125 115 130 L110 170 Q100 165 90 170 Z" fill="#ffffff"/>
  <rect x="85" y="145" width="30" height="50" fill="#ffffff" rx="3">
    <animate attributeName="fill" values="#ffffff;#f8f9fa;#ffffff" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Tie -->
  <polygon points="100,130 95,150 100,170 105,150" fill="#ff4500"/>
  
  <!-- Rocket -->
  <path d="M40 120 L50 100 L60 120 Z" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite"/>
  </path>
  <rect x="45" y="120" width="10" height="15" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <path d="M45 135 L40 145 L55 145 L50 135 Z" fill="#ff4500">
    <animate attributeName="fill" values="#ff4500;#ff6347;#ff4500" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle cx="50" cy="110" r="3" fill="#1da1f2">
    <animate attributeName="fill" values="#1da1f2;#4fc3f7;#1da1f2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Rocket exhaust -->
  <path d="M45 145 Q50 155 55 145" fill="#ff4500" fill-opacity="0.5">
    <animate attributeName="fill-opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Electric car -->
  <rect x="130" y="140" width="25" height="10" rx="3" ry="3" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ff3333;#ff0000" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="135" cy="150" r="3" fill="#000000">
    <animate attributeName="fill" values="#000000;#333333;#000000" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 135 150;360 135 150" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="150" r="3" fill="#000000">
    <animate attributeName="fill" values="#000000;#333333;#000000" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 150 150;360 150 150" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- Electric car headlights -->
  <circle cx="155" cy="142" r="1" fill="#ffff00" fill-opacity="0.8">
    <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Social media bird -->
  <ellipse cx="145" cy="110" rx="8" ry="6" fill="#1da1f2">
    <animate attributeName="fill" values="#1da1f2;#4fc3f7;#1da1f2" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <polygon points="153,110 160,105 153,115" fill="#1da1f2">
    <animate attributeName="fill" values="#1da1f2;#4fc3f7;#1da1f2" dur="3s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="142" cy="108" r="1" fill="#ffffff">
    <animate attributeName="r" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M145 116 L150 125" fill="none" stroke="#1da1f2" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#1da1f2;#4fc3f7;#1da1f2" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M145 116 L140 125" fill="none" stroke="#1da1f2" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#1da1f2;#4fc3f7;#1da1f2" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Mars symbol -->
  <circle cx="50" cy="170" r="8" fill="none" stroke="#ff4500" stroke-width="2">
    <animate attributeName="stroke" values="#ff4500;#ff6347;#ff4500" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="8;8.5;8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M55 165 L65 155" fill="none" stroke="#ff4500" stroke-width="2">
    <animate attributeName="stroke" values="#ff4500;#ff6347;#ff4500" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M60 155 L65 155 L65 160" fill="none" stroke="#ff4500" stroke-width="2">
    <animate attributeName="stroke" values="#ff4500;#ff6347;#ff4500" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Innovation particles -->
  <circle cx="30" cy="40" r="2" fill="#ffd700">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;2.5;2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="60" r="1.5" fill="#00ff00">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;2;1.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="160" r="1" fill="#ff6b6b">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;1.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Neuralink brain waves -->
  <path d="M20 100 Q40 90 60 100 Q80 110 100 100" fill="none" stroke="#9b59b6" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#9b59b6;#8e44ad;#9b59b6" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M100 100 Q120 90 140 100 Q160 110 180 100" fill="none" stroke="#9b59b6" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#9b59b6;#8e44ad;#9b59b6" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Hyperloop tube -->
  <ellipse cx="100" cy="180" rx="40" ry="5" fill="#95a5a6" opacity="0.7">
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#95a5a6;#bdc3c7;#95a5a6" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Tech vision aura -->
  <circle cx="100" cy="90" r="50" fill="none" stroke="#3498db" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="50;52;50" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#3498db;#1abc9c;#3498db" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <text x="20" y="130" font-family="monospace" font-size="8" fill="#2c3e50" fill-opacity="0.6">
    <animate attributeName="x" values="20;25;20" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="6s" repeatCount="indefinite"/>
    $
  </text>
  <text x="170" y="180" font-family="monospace" font-size="6" fill="#ff4500" fill-opacity="0.6">
    <animate attributeName="x" values="170;165;170" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    ♂
  </text>
  
  <!-- Cryptocurrency symbols -->
  <text x="25" y="40" font-family="monospace" font-size="10" fill="#f7931a" fill-opacity="0.7">
    <animate attributeName="fill-opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#f7931a;#ffa500;#f7931a" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 25 40;10 25 40;-10 25 40;0 25 40" dur="5s" repeatCount="indefinite"/>
    ₿
  </text>
  <text x="175" y="40" font-family="monospace" font-size="10" fill="#627eea" fill-opacity="0.7">
    <animate attributeName="fill-opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#627eea;#3498db;#627eea" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 175 40;-10 175 40;10 175 40;0 175 40" dur="5s" repeatCount="indefinite"/>
    Ξ
  </text>
  <text x="160" y="60" font-family="monospace" font-size="10" fill="#c2a633" fill-opacity="0.7">
    <animate attributeName="fill-opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#c2a633;#daa520;#c2a633" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 160 60;15 160 60;-15 160 60;0 160 60" dur="5s" repeatCount="indefinite"/>
    Ð
  </text>
  
  <!-- Satellite internet -->
  <path d="M20 60 Q30 50 40 60" fill="none" stroke="#3498db" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="stroke" values="#3498db;#87cefa;#3498db" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M20 60 Q30 70 40 60" fill="none" stroke="#3498db" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="stroke" values="#3498db;#87cefa;#3498db" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle cx="20" cy="60" r="3" fill="#95a5a6">
    <animate attributeName="fill" values="#95a5a6;#bdc3c7;#95a5a6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="60" r="1.5" fill="#3498db">
    <animate attributeName="fill" values="#3498db;#87cefa;#3498db" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;2;1.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Neural interface -->
  <circle cx="170" cy="100" r="6" fill="none" stroke="#9b59b6" stroke-width="1">
    <animate attributeName="stroke" values="#9b59b6;#8e44ad;#9b59b6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="6;7;6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M164 100 L176 100" fill="none" stroke="#9b59b6" stroke-width="1">
    <animate attributeName="stroke" values="#9b59b6;#8e44ad;#9b59b6" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M170 94 L170 106" fill="none" stroke="#9b59b6" stroke-width="1">
    <animate attributeName="stroke" values="#9b59b6;#8e44ad;#9b59b6" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M165 95 L175 105" fill="none" stroke="#9b59b6" stroke-width="1">
    <animate attributeName="stroke" values="#9b59b6;#8e44ad;#9b59b6" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M165 105 L175 95" fill="none" stroke="#9b59b6" stroke-width="1">
    <animate attributeName="stroke" values="#9b59b6;#8e44ad;#9b59b6" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M170 100 Q160 80 150 90" fill="none" stroke="#9b59b6" stroke-width="1" stroke-dasharray="2,1">
    <animate attributeName="stroke" values="#9b59b6;#8e44ad;#9b59b6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Smartphone -->
  <rect x="30" y="80" width="10" height="18" rx="2" ry="2" fill="#34495e">
    <animate attributeName="fill" values="#34495e;#2c3e50;#34495e" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="31" y="82" width="8" height="14" rx="1" ry="1" fill="#ecf0f1">
    <animate attributeName="fill" values="#ecf0f1;#bdc3c7;#ecf0f1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="35" cy="97" r="0.8" fill="#7f8c8d">
    <animate attributeName="fill" values="#7f8c8d;#95a5a6;#7f8c8d" dur="3s" repeatCount="indefinite"/>
  </circle>
  <rect x="33" y="84" width="4" height="1" fill="#3498db">
    <animate attributeName="fill" values="#3498db;#2980b9;#3498db" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="33" y="86" width="4" height="1" fill="#e74c3c">
    <animate attributeName="fill" values="#e74c3c;#c0392b;#e74c3c" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="33" y="88" width="4" height="1" fill="#2ecc71">
    <animate attributeName="fill" values="#2ecc71;#27ae60;#2ecc71" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>