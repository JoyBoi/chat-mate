<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f5f5dc" stroke="#228b22" stroke-width="3"/>
  
  <!-- Balding head with side hair -->
  <ellipse cx="100" cy="85" rx="35" ry="30" fill="#fdbcb4"/>
  <!-- Side hair -->
  <path d="M65 85 Q70 75 75 85 Q70 95 65 85" fill="#d3d3d3"/>
  <path d="M135 85 Q130 75 125 85 Q130 95 135 85" fill="#d3d3d3"/>
  <!-- Back hair -->
  <path d="M75 70 Q100 65 125 70 Q120 80 100 75 Q80 80 75 70" fill="#d3d3d3"/>
  
  <!-- Glasses -->
  <circle cx="90" cy="95" r="12" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="110" cy="95" r="12" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <line x1="102" y1="95" x2="98" y2="95" stroke="#2c3e50" stroke-width="2"/>
  <!-- Glasses reflection (subtle) -->
  <ellipse cx="85" cy="90" rx="4" ry="2" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="105" cy="90" rx="4" ry="2" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Eyes behind glasses -->
  <circle cx="90" cy="95" r="3" fill="#2c3e50"/>
  <circle cx="110" cy="95" r="3" fill="#2c3e50"/>
  
  <!-- Nose -->
  <polygon points="100,105 97,112 103,112" fill="#f4a460"/>
  
  <!-- Friendly smile -->
  <path d="M90 125 Q100 135 110 125" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Mustache -->
  <ellipse cx="100" cy="120" rx="8" ry="3" fill="#d3d3d3"/>
  
  <!-- Suit jacket -->
  <path d="M70 150 Q100 140 130 150 L135 185 Q100 175 65 185 Z" fill="#2c3e50"/>
  
  <!-- Shirt -->
  <path d="M80 150 Q100 145 120 150 L115 180 Q100 175 85 180 Z" fill="white"/>
  
  <!-- Tie -->
  <polygon points="100,155 95,175 105,175" fill="#8b0000"/>
  <!-- Tie pattern -->
  <circle cx="100" cy="160" r="2" fill="#daa520"/>
  <circle cx="100" cy="170" r="2" fill="#daa520"/>
  
  <!-- Dollar sign pattern on tie (reduced for better character focus) -->
  <text x="100" y="162" font-family="Arial" font-size="6" fill="#daa520" text-anchor="middle" opacity="0.8">$</text>
  <text x="100" y="168" font-family="Arial" font-size="6" fill="#daa520" text-anchor="middle" opacity="0.8">$</text>
  
  <!-- Calculator (simplified as supporting element) -->
  <rect x="130" y="140" width="15" height="20" fill="#2c3e50" stroke="#1c1c1c" stroke-width="1" opacity="0.9"/>
  <rect x="132" y="142" width="11" height="6" fill="#00ff00" opacity="0.8"/>
  <!-- Calculator buttons -->
  <circle cx="135" cy="152" r="0.8" fill="#d3d3d3"/>
  <circle cx="140" cy="152" r="0.8" fill="#d3d3d3"/>
  <circle cx="135" cy="155" r="0.8" fill="#d3d3d3"/>
  <circle cx="140" cy="155" r="0.8" fill="#d3d3d3"/>
  
  <!-- Stock chart in other hand -->
  <rect x="50" y="135" width="20" height="15" fill="white" stroke="#2c3e50" stroke-width="1"/>
  <polyline points="52,145 55,140 58,142 62,138 65,140 68,135" fill="none" stroke="#228b22" stroke-width="2">
    <animate attributeName="points" values="52,145 55,140 58,142 62,138 65,140 68,135;52,143 55,138 58,144 62,136 65,142 68,133;52,145 55,140 58,142 62,138 65,140 68,135" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#228b22;#32cd32;#228b22" dur="2s" repeatCount="indefinite" />
  </polyline>
  <!-- Stock trend indicators -->
  <circle cx="68" cy="133" r="1" fill="#00ff00" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="52" y="148" font-family="Arial" font-size="3" fill="#228b22" opacity="0.7">$$$</text>
  
  <!-- Money bag -->
  <ellipse cx="75" cy="170" rx="8" ry="10" fill="#8b4513">
    <animate attributeName="ry" values="10;11;10" dur="3s" repeatCount="indefinite" />
  </ellipse>
  <rect x="72" y="165" width="6" height="5" fill="#a0522d"/>
  <path d="M72 165 Q75 160 78 165" fill="none" stroke="#654321" stroke-width="2"/>
  <!-- Dollar sign on bag -->
  <path d="M75 170 Q73 168 75 166 Q77 168 75 170 Q73 172 75 174" fill="none" stroke="#daa520" stroke-width="1">
    <animate attributeName="stroke" values="#daa520;#ffd700;#daa520" dur="2s" repeatCount="indefinite" />
  </path>
  <line x1="75" y1="165" x2="75" y2="175" stroke="#daa520" stroke-width="1">
    <animate attributeName="stroke" values="#daa520;#ffd700;#daa520" dur="2s" repeatCount="indefinite" />
  </line>
  
  <!-- Wealth aura -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#daa520" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="88;93;88" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Floating dollar signs -->
  <text x="160" y="80" font-family="Arial" font-size="8" fill="#228b22" opacity="0.6">$
    <animateTransform attributeName="transform" type="translate" values="0,0;-5,-10;0,0" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="40" y="120" font-family="Arial" font-size="6" fill="#daa520" opacity="0.5">$
    <animateTransform attributeName="transform" type="translate" values="0,0;8,-8;0,0" dur="5s" repeatCount="indefinite"/>
  </text>
  
  <!-- Wisdom lines around eyes -->
  <path d="M78 90 Q82 88 86 90" fill="none" stroke="#8b4513" stroke-width="1"/>
  <path d="M114 90 Q118 88 122 90" fill="none" stroke="#8b4513" stroke-width="1"/>
  <path d="M78 100 Q82 102 86 100" fill="none" stroke="#8b4513" stroke-width="1"/>
  <path d="M114 100 Q118 102 122 100" fill="none" stroke="#8b4513" stroke-width="1"/>
</svg>