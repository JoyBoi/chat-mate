<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="#00d4ff" stroke-width="3">
    <animate attributeName="fill" values="#1a1a2e;#0f0f23;#1a1a2e" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;4;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="35" ry="40" fill="#fdbcb4">
    <animate attributeName="fill" values="#fdbcb4;#ffcccb;#fdbcb4" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Hair (wild scientist hair) -->
  <path d="M70 60 Q100 40 130 60 L125 75 Q100 55 75 75 Z" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M65 65 Q60 50 55 65" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 60 57.5;3 60 57.5;-3 60 57.5;0 60 57.5" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M75 55 Q70 40 65 55" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 70 47.5;-2 70 47.5;2 70 47.5;0 70 47.5" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
  </path>
  <path d="M125 55 Q130 40 135 55" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 130 47.5;2 130 47.5;-2 130 47.5;0 130 47.5" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
  </path>
  <path d="M135 65 Q140 50 145 65" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 140 57.5;-3 140 57.5;3 140 57.5;0 140 57.5" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  
  <!-- Mustache -->
  <ellipse cx="100" cy="105" rx="18" ry="5" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="18;19;18" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M82 105 Q85 100 88 105" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 85 102.5;2 85 102.5;-2 85 102.5;0 85 102.5" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M118 105 Q115 100 112 105" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 115 102.5;-2 115 102.5;2 115 102.5;0 115 102.5" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="85" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;6;8" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="115" cy="85" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;6;8" dur="3s" repeatCount="indefinite" begin="0.2s"/>
  </ellipse>
  <circle cx="85" cy="85" r="3" fill="#00d4ff">
    <animate attributeName="fill" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;4;2;3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="85" r="3" fill="#00d4ff">
    <animate attributeName="fill" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="r" values="3;4;2;3" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  
  <!-- Eyebrows -->
  <path d="M75 75 L95 78" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-width" values="3;4;3" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 85 76.5;-3 85 76.5;0 85 76.5" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M125 75 L105 78" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-width" values="3;4;3" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    <animateTransform attributeName="transform" type="rotate" values="0 115 76.5;3 115 76.5;0 115 76.5" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </path>
  
  <!-- Nose -->
  <polygon points="100,95 95,105 105,105" fill="#f4a460"/>
  
  <!-- Mouth -->
  <path d="M90 115 Q100 120 110 115" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Lab coat -->
  <path d="M70 130 Q100 125 130 130 L135 190 Q100 185 65 190 Z" fill="white">
    <animate attributeName="fill" values="white;#f0f0ff;white" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Vest -->
  <path d="M80 140 Q100 135 120 140 L115 175 Q100 170 85 175 Z" fill="#2c3e50"/>
  
  <!-- Bow tie -->
  <polygon points="95,140 105,140 110,145 105,150 95,150 90,145" fill="#8b0000"/>
  <rect x="97" y="142" width="6" height="6" fill="#654321"/>
  
  <!-- Tesla coil -->
  <rect x="40" y="120" width="8" height="30" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="44" cy="120" r="6" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#a9a9a9;#c0c0c0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="6;7;5;6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M44 114 Q50 110 56 114" fill="none" stroke="#c0c0c0" stroke-width="2">
    <animate attributeName="stroke" values="#c0c0c0;#00d4ff;#c0c0c0" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;3;2" dur="0.5s" repeatCount="indefinite"/>
  </path>
  <path d="M44 108 Q52 104 60 108" fill="none" stroke="#c0c0c0" stroke-width="2">
    <animate attributeName="stroke" values="#c0c0c0;#00d4ff;#c0c0c0" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="stroke-width" values="2;3;2" dur="0.5s" repeatCount="indefinite" begin="0.3s"/>
  </path>
  
  <!-- Lightning bolts -->
  <path d="M50 100 L45 90 L50 85 L45 75" fill="none" stroke="#00d4ff" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke" values="#00d4ff;#ffffff;#00ffff;#00d4ff" dur="0.3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;5;1;3" dur="0.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.3;0.8" dur="0.4s" repeatCount="indefinite"/>
  </path>
  <path d="M150 110 L145 100 L150 95 L145 85" fill="none" stroke="#00d4ff" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke" values="#00d4ff;#ffffff;#00ffff;#00d4ff" dur="0.3s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="stroke-width" values="3;5;1;3" dur="0.2s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="opacity" values="0.8;1;0.3;0.8" dur="0.4s" repeatCount="indefinite" begin="0.1s"/>
  </path>
  <path d="M120 70 L115 60 L120 55 L115 45" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#00d4ff;#ffffff;#00ffff;#00d4ff" dur="0.25s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="stroke-width" values="2;4;1;2" dur="0.15s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="opacity" values="0.7;1;0.2;0.7" dur="0.35s" repeatCount="indefinite" begin="0.2s"/>
  </path>
  
  <!-- Electrical sparks -->
  <circle cx="60" cy="80" r="2" fill="#00d4ff" opacity="0.8">
    <animate attributeName="fill" values="#00d4ff;#ffffff;#00ffff;#00d4ff" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;4;1;2" dur="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.2;0.8" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="90" r="2" fill="#00d4ff" opacity="0.8">
    <animate attributeName="fill" values="#00d4ff;#ffffff;#00ffff;#00d4ff" dur="0.5s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="r" values="2;4;1;2" dur="0.3s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="opacity" values="0.8;1;0.2;0.8" dur="0.6s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="75" cy="50" r="1" fill="#00d4ff" opacity="0.6">
    <animate attributeName="fill" values="#00d4ff;#ffffff;#00ffff;#00d4ff" dur="0.4s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="r" values="1;3;0.5;1" dur="0.25s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="opacity" values="0.6;1;0.1;0.6" dur="0.5s" repeatCount="indefinite" begin="0.1s"/>
  </circle>
  <circle cx="125" cy="50" r="1" fill="#00d4ff" opacity="0.6">
    <animate attributeName="fill" values="#00d4ff;#ffffff;#00ffff;#00d4ff" dur="0.4s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="r" values="1;3;0.5;1" dur="0.25s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0.6;1;0.1;0.6" dur="0.5s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  
  <!-- Light bulb -->
  <circle cx="160" cy="140" r="8" fill="#ffff99" opacity="0.8">
    <animate attributeName="fill" values="#ffff99;#ffffff;#ffff00;#ffff99" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="8;10;6;8" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.4;0.8" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <rect x="157" y="148" width="6" height="4" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="156" y="152" width="8" height="2" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Wireless waves -->
  <path d="M30 160 Q40 150 50 160" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6">
    <animate attributeName="stroke" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.2;0.6" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;3;1;2" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M25 165 Q40 150 55 165" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.4">
    <animate attributeName="stroke" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.4;0.8;0.1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="stroke-width" values="2;3;1;2" dur="1.8s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  <path d="M20 170 Q40 150 60 170" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.2">
    <animate attributeName="stroke" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.2;0.6;0.05;0.2" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="stroke-width" values="2;3;1;2" dur="1.8s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- Rotating generator -->
  <circle cx="170" cy="170" r="12" fill="none" stroke="#c0c0c0" stroke-width="2">
    <animate attributeName="stroke" values="#c0c0c0;#d3d3d3;#a9a9a9;#c0c0c0" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 170 170;360 170 170" dur="2s" repeatCount="indefinite"/>
  </circle>
  <rect x="168" y="158" width="4" height="24" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 170 170;360 170 170" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="158" y="168" width="24" height="4" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 170 170;360 170 170" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Electrical field lines -->
  <ellipse cx="100" cy="100" rx="80" ry="40" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;10 100 100;-10 100 100;0 100 100" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="100" cy="100" rx="60" ry="30" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.2;0.4" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="2.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;-15 100 100;15 100 100;0 100 100" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Plasma ball effect -->
  <circle cx="100" cy="90" r="45" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.5;0.1;0.2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00d4ff;#ffffff;#00ffff;#00d4ff" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="45;47;43;45" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- AC current waves -->
  <path d="M15 180 Q25 175 35 180 Q45 185 55 180" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6">
    <animate attributeName="stroke" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.3;0.6" dur="1.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;10,0;20,0;30,0;40,0" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M145 180 Q155 175 165 180 Q175 185 185 180" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6">
    <animate attributeName="stroke" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="1s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.6;1;0.3;0.6" dur="1.2s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-10,0;-20,0;-30,0;-40,0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  
  <!-- Invention blueprints -->
  <rect x="15" y="30" width="20" height="15" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.3;0.5" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="3s" repeatCount="indefinite"/>
  </rect>
  <path d="M17 32 L33 32 M17 35 L30 35 M17 38 L28 38 M17 41 L31 41" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.4;0.6" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00d4ff;#00ffff;#0080ff;#00d4ff" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Magnetic field visualization -->
  <path d="M80 30 Q90 25 100 30 Q110 35 120 30" fill="none" stroke="#ff6347" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.2;0.4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#ff6347;#ff4500;#ff6347" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0;0,2;0,0" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M80 35 Q90 30 100 35 Q110 40 120 35" fill="none" stroke="#ff6347" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.2;0.4" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="stroke" values="#ff6347;#ff4500;#ff6347" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,2;0,0;0,-2;0,0" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </path>
</svg>