<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f5f5dc" stroke="#8b4513" stroke-width="3">
    <animate attributeName="fill" values="#f5f5dc;#f0e68c;#f5f5dc" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#8b4513;#a0522d;#8b4513" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;4;3" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Skull head -->
  <ellipse cx="100" cy="90" rx="30" ry="35" fill="#f5f5dc">
    <animate attributeName="fill" values="#f5f5dc;#fff8dc;#f5f5dc" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Napoleon hat -->
  <path d="M70 60 Q100 45 130 60 L125 70 Q100 55 75 70 Z" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  <ellipse cx="100" cy="65" rx="25" ry="8" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#34495e;#2c3e50" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  <animate attributeName="ry" values="8;9;8" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Hat cockade -->
  <circle cx="85" cy="65" r="4" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ff4500;#ff0000" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;4.5;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85" cy="65" r="2" fill="#ffffff">
    <animate attributeName="fill" values="#ffffff;#f0f8ff;#ffffff" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="85" cy="65" r="1" fill="#0000ff">
    <animate attributeName="fill" values="#0000ff;#4169e1;#0000ff" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <!-- Skull eye sockets -->
  <ellipse cx="88" cy="85" rx="8" ry="10" fill="#2c2c2c"/>
  <ellipse cx="112" cy="85" rx="8" ry="10" fill="#2c2c2c"/>
  
  <!-- Glowing eyes -->
  <circle cx="88" cy="85" r="3" fill="#ff4500" opacity="0.8">
    <animate attributeName="fill" values="#ff4500;#ff6347;#ff0000;#ff4500" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.5;0.8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;4;2;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="112" cy="85" r="3" fill="#ff4500" opacity="0.8">
    <animate attributeName="fill" values="#ff4500;#ff6347;#ff0000;#ff4500" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.8;1;0.5;0.8" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="r" values="3;4;2;3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <!-- Nasal cavity -->
  <polygon points="100,95 95,110 105,110" fill="#2c2c2c"/>
  
  <!-- Skeletal jaw -->
  <path d="M85 115 Q100 120 115 115 L110 125 Q100 130 90 125 Z" fill="#f5f5dc">
    <animate attributeName="fill" values="#f5f5dc;#fff8dc;#f5f5dc" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,1;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Teeth -->
  <rect x="92" y="120" width="2" height="5" fill="#ffffff"/>
  <rect x="96" y="120" width="2" height="5" fill="#ffffff"/>
  <rect x="100" y="120" width="2" height="5" fill="#ffffff"/>
  <rect x="104" y="120" width="2" height="5" fill="#ffffff"/>
  <rect x="108" y="120" width="2" height="5" fill="#ffffff"/>
  
  <!-- Military uniform -->
  <path d="M70 130 Q100 125 130 130 L135 190 Q100 185 65 190 Z" fill="#4169e1">
    <animate attributeName="fill" values="#4169e1;#6495ed;#4169e1" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Gold braiding -->
  <path d="M75 140 Q100 135 125 140" fill="none" stroke="#daa520" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke" values="#daa520;#ffd700;#daa520" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;4;3" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M75 150 Q100 145 125 150" fill="none" stroke="#daa520" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke" values="#daa520;#ffd700;#daa520" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="stroke-width" values="3;4;3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  <path d="M75 160 Q100 155 125 160" fill="none" stroke="#daa520" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke" values="#daa520;#ffd700;#daa520" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="stroke-width" values="3;4;3" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- Military buttons -->
  <circle cx="85" cy="145" r="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;3.5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="145" r="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="r" values="3;3.5;3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="85" cy="155" r="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="3;3.5;3" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="115" cy="155" r="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="r" values="3;3.5;3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="85" cy="165" r="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="3;3.5;3" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="115" cy="165" r="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="r" values="3;3.5;3" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Epaulettes -->
  <rect x="65" y="135" width="15" height="8" rx="2" ry="2" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="120" y="135" width="15" height="8" rx="2" ry="2" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  
  <!-- Fringe on epaulettes -->
  <path d="M67 143 L67 150" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>
  <path d="M70 143 L70 150" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>
  <path d="M73 143 L73 150" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>
  <path d="M76 143 L76 150" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>
  
  <path d="M122 143 L122 150" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>
  <path d="M125 143 L125 150" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>
  <path d="M128 143 L128 150" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>
  <path d="M131 143 L131 150" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Sword -->
  <rect x="40" y="140" width="3" height="25" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 41.5 152.5;2 41.5 152.5;-2 41.5 152.5;0 41.5 152.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="38" y="140" width="7" height="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 41.5 141.5;2 41.5 141.5;-2 41.5 141.5;0 41.5 141.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="41" cy="138" r="2" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;2.5;2" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Battle map -->
  <rect x="140" y="130" width="20" height="15" fill="#f5deb3">
    <animate attributeName="fill" values="#f5deb3;#f0e68c;#f5deb3" dur="5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 150 137.5;1 150 137.5;-1 150 137.5;0 150 137.5" dur="5s" repeatCount="indefinite"/>
  </rect>
  <path d="M145 135 L155 140" fill="none" stroke="#8b0000" stroke-width="1">
    <animate attributeName="stroke" values="#8b0000;#b22222;#8b0000" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;1.5;1" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M150 132 L150 142" fill="none" stroke="#8b0000" stroke-width="1">
    <animate attributeName="stroke" values="#8b0000;#b22222;#8b0000" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="stroke-width" values="1;1.5;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  <circle cx="148" cy="138" r="1" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ff4500;#ff0000" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;1.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="136" r="1" fill="#0000ff">
    <animate attributeName="fill" values="#0000ff;#4169e1;#0000ff" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="r" values="1;1.5;1" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <!-- Bone elements -->
  <rect x="30" y="160" width="12" height="3" rx="1" ry="1" fill="#f5f5dc"/>
  <circle cx="30" cy="161" r="2" fill="#f5f5dc"/>
  <circle cx="42" cy="161" r="2" fill="#f5f5dc"/>
  
  <!-- Medal (simplified animation) -->
  <circle cx="100" cy="175" r="6" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="3s" repeatCount="indefinite"/>
  </circle>
  <polygon points="100,170 102,175 100,180 98,175" fill="#ff0000"/>
  
  <!-- Ghostly aura (reduced for better character focus) -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#87ceeb" stroke-width="2" opacity="0.2" stroke-dasharray="5,5">
    <animate attributeName="stroke" values="#87ceeb;#b0e0e6;#87ceeb" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.3;0.1;0.2" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="85;88;85" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="5,5;8,3;5,5" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Battle spirit -->
  <path d="M60 50 Q80 30 100 50 Q120 70 140 50" fill="none" stroke="#f8f8ff" stroke-width="1" opacity="0.2">
    <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="d" values="M60 50 Q80 30 100 50 Q120 70 140 50;M60 55 Q80 35 100 55 Q120 75 140 55;M60 50 Q80 30 100 50 Q120 70 140 50" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>