<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Character Gallery</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background-color: #f5f5f7;
        color: #333;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #1d1d1f;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }
      .card {
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      }
      .card-content {
        padding: 20px;
      }
      .svg-container {
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f0f0f0;
        padding: 20px;
      }
      .svg-container svg {
        max-height: 100%;
        max-width: 100%;
      }
      h2 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 18px;
        color: #1d1d1f;
      }
      .file-info {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: #86868b;
        margin-top: 10px;
      }
      .view-link {
        display: inline-block;
        margin-top: 10px;
        color: #0066cc;
        text-decoration: none;
      }
      .view-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>SVG Character Gallery</h1>

    <div class="gallery" id="gallery">
      <!-- Cards will be dynamically inserted here -->
    </div>

    <script>
      // List of SVG files
      const svgFiles = [
        'tony-snark.svg',
        'synthpool.svg',
        'indiana-jokes.svg',
        'cleopatra-vii-eleven.svg',
        'darth-coder.svg',
        'gordon-ramsalt.svg',
        'albert-einswine.svg',
        'captain-jerk-sparrow.svg',
        'dr-sigmund-fraud.svg',
        'elon-tusk.svg',
        'gandalf-the-vague.svg',
        'hermione-danger.svg',
        'incredible-bulk.svg',
        'marie-curie-osity.svg',
        'master-yoda-script.svg',
        'monday-addams.svg',
        'napoleon-bone-apart.svg',
        'nikola-testla.svg',
        'sherlock-holmeless.svg',
        'spork.svg',
        'warren-peace.svg',
        'william-shakesbeer.svg',
      ];

      const gallery = document.getElementById('gallery');

      // Create a card for each SVG file
      svgFiles.forEach(file => {
        const fileName = file.replace('.svg', '');
        const displayName = fileName
          .split('-')
          .map(word => word.charAt(0).toUpperCase() + word.slice(1))
          .join(' ');

        const card = document.createElement('div');
        card.className = 'card';

        // Fetch the SVG content
        fetch(file)
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
          })
          .then(svgContent => {
            // Create SVG container
            const svgContainer = document.createElement('div');
            svgContainer.className = 'svg-container';
            svgContainer.innerHTML = svgContent;

            // Create card content
            const cardContent = document.createElement('div');
            cardContent.className = 'card-content';

            // Add character name
            const title = document.createElement('h2');
            title.textContent = displayName;
            cardContent.appendChild(title);

            // Add file info
            const fileInfo = document.createElement('div');
            fileInfo.className = 'file-info';
            fileInfo.innerHTML = `<span>${file}</span>`;
            cardContent.appendChild(fileInfo);

            // Add view link
            const viewLink = document.createElement('a');
            viewLink.href = file;
            viewLink.className = 'view-link';
            viewLink.textContent = 'View Full SVG';
            viewLink.target = '_blank';
            cardContent.appendChild(viewLink);

            // Assemble the card
            card.appendChild(svgContainer);
            card.appendChild(cardContent);

            // Add the card to the gallery
            gallery.appendChild(card);
          })
          .catch(error => {
            console.error(`Error loading ${file}:`, error);
            card.innerHTML = `<div class="card-content"><h2>${displayName}</h2><p>Error loading SVG</p></div>`;
            gallery.appendChild(card);
          });
      });
    </script>
  </body>
</html>
