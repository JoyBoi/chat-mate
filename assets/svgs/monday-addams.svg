<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#2c3e50" stroke="#6c5ce7" stroke-width="3"/>
  
  <!-- Hair - black with pigtails -->
  <path d="M60 80 Q80 50 100 60 Q120 50 140 80 L140 140 Q120 150 100 140 Q80 150 60 140 Z" fill="#111111"/>
  
  <!-- Hair parting in middle -->
  <path d="M100 60 L100 85" stroke="#2c3e50" stroke-width="1"/>
  
  <!-- Pigtails -->
  <path d="M60 100 Q40 120 45 150 Q50 145 60 140" fill="#111111"/>
  <path d="M140 100 Q160 120 155 150 Q150 145 140 140" fill="#111111"/>
  
  <!-- Hair ties -->
  <ellipse cx="60" cy="100" rx="5" ry="3" fill="#6c5ce7"/>
  <ellipse cx="140" cy="100" rx="5" ry="3" fill="#6c5ce7"/>
  
  <!-- Face - pale -->
  <ellipse cx="100" cy="100" rx="25" ry="30" fill="#f1f1f1"/>
  
  <!-- Eyes - deadpan, slightly downturned with subtle animation -->
  <ellipse cx="90" cy="95" rx="5" ry="3" fill="#111111">
    <animate attributeName="ry" values="3;0.5;3" dur="8s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="110" cy="95" rx="5" ry="3" fill="#111111">
    <animate attributeName="ry" values="3;0.5;3" dur="8s" repeatCount="indefinite" />
  </ellipse>
  
  <!-- Eyebrows - straight and slightly angled -->
  <line x1="83" y1="90" x2="97" y2="88" stroke="#111111" stroke-width="2"/>
  <line x1="103" y1="88" x2="117" y2="90" stroke="#111111" stroke-width="2"/>
  
  <!-- Mouth - small, straight line -->
  <line x1="95" y1="115" x2="105" y2="115" stroke="#111111" stroke-width="1.5"/>
  
  <!-- Dark circles under eyes -->
  <path d="M85 98 Q90 102 95 98" stroke="#6c5ce7" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M105 98 Q110 102 115 98" stroke="#6c5ce7" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Gothic dress with white collar -->
  <path d="M75 130 L70 180 L130 180 L125 130" fill="#111111"/>
  
  <!-- White collar -->
  <path d="M75 130 L85 140 L100 130 L115 140 L125 130" fill="#f1f1f1"/>
  
  <!-- Monday elements -->
  <!-- Animated calendar showing Monday -->
  <rect x="140" y="50" width="25" height="25" fill="#f1f1f1" stroke="#111111" stroke-width="1">
    <animate attributeName="stroke" values="#111111;#6c5ce7;#e74c3c;#111111" dur="6s" repeatCount="indefinite" />
  </rect>
  <text x="152" y="65" font-family="Arial" font-size="6" fill="#111111" text-anchor="middle" font-weight="bold">
    <animate attributeName="fill" values="#111111;#e74c3c;#6c5ce7;#111111" dur="6s" repeatCount="indefinite" />
    MON
  </text>
  <line x1="140" y1="55" x2="165" y2="55" stroke="#111111" stroke-width="1">
    <animate attributeName="stroke-width" values="1;1.5;1;1.5;1" dur="3s" repeatCount="indefinite" />
  </line>
  
  <!-- Monday dread effect -->
  <text x="152" y="73" font-family="Arial" font-size="3" fill="#e74c3c" text-anchor="middle" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.8;0.4;0.7" dur="4s" repeatCount="indefinite" />
    DREAD
  </text>
  
  <!-- Animated coffee mug with "I hate Mondays" -->
  <path d="M50 50 L45 65 L60 65 L55 50" fill="#6c5ce7">
    <animate attributeName="fill" values="#6c5ce7;#8e44ad;#6c5ce7" dur="8s" repeatCount="indefinite" />
  </path>
  <path d="M60 55 L65 57 L65 62 L60 65" fill="#6c5ce7">
    <animate attributeName="fill" values="#6c5ce7;#8e44ad;#6c5ce7" dur="8s" repeatCount="indefinite" />
  </path>
  <line x1="48" y1="60" x2="57" y2="60" stroke="#f1f1f1" stroke-width="0.5"/>
  
  <!-- Coffee steam -->
  <path d="M52 48 Q54 45 56 48" stroke="#f1f1f1" stroke-width="0.5" fill="none" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.7;0.2;0.6" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,-2;0,-1;0,0" dur="3s" repeatCount="indefinite" additive="sum" />
  </path>
  <path d="M49 49 Q51 46 53 49" stroke="#f1f1f1" stroke-width="0.5" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.5;0.2;0.4" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,-2;0,-1;0,0" dur="4s" repeatCount="indefinite" additive="sum" />
  </path>
  
  <!-- Animated spider web in corner -->
  <path d="M30 30 L40 35 L50 30 L45 40 L50 50 L40 45 L30 50 L35 40 Z" fill="none" stroke="#f1f1f1" stroke-width="0.5" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.9;0.5;0.8;0.7" dur="4s" repeatCount="indefinite" />
  </path>
  <circle cx="40" cy="40" r="1" fill="#111111">
    <animate attributeName="r" values="1;1.5;0.8;1.2;1" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Animated small spider -->
  <circle cx="35" cy="45" r="2" fill="#111111">
    <animateTransform attributeName="transform" type="translate" values="0,0;1,-1;-1,1;0,0" dur="6s" repeatCount="indefinite" />
  </circle>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;1,-1;-1,1;0,0" dur="6s" repeatCount="indefinite" />
    <line x1="33" y1="43" x2="31" y2="41" stroke="#111111" stroke-width="0.5"/>
    <line x1="37" y1="43" x2="39" y2="41" stroke="#111111" stroke-width="0.5"/>
    <line x1="33" y1="47" x2="31" y2="49" stroke="#111111" stroke-width="0.5"/>
    <line x1="37" y1="47" x2="39" y2="49" stroke="#111111" stroke-width="0.5"/>
  </g>
  
  <!-- Animated dark cloud thought bubble -->
  <path d="M130 80 Q140 70 150 75 Q160 65 155 80 Q165 85 155 90 Q160 100 150 95 Q140 105 135 95 Q125 100 130 90 Q120 85 130 80" fill="#2c3e50" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.6;0.9;0.7;0.8" dur="5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="scale" values="1;1.03;0.98;1.02;1" dur="7s" repeatCount="indefinite" additive="sum" />
  </path>
  <path d="M125 90 L115 100" stroke="#2c3e50" stroke-width="2" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.6;0.9;0.7;0.8" dur="5s" repeatCount="indefinite" />
  </path>
  <path d="M115 100 L110 105" stroke="#2c3e50" stroke-width="1.5" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.6;0.9;0.7;0.8" dur="5s" repeatCount="indefinite" />
  </path>
  
  <!-- Flickering lightning bolt in thought bubble -->
  <path d="M140 80 L135 88 L145 88 L140 95" fill="none" stroke="#f1c40f" stroke-width="1.5">
    <animate attributeName="opacity" values="1;0.3;1;0.5;1;0.2;1" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#f1c40f;#e74c3c;#f1c40f;#9b59b6;#f1c40f" dur="2.5s" repeatCount="indefinite" />
  </path>
  
  <!-- Animated tiny skull accessory -->
  <circle cx="100" cy="140" r="3" fill="#f1f1f1">
    <animate attributeName="fill" values="#f1f1f1;#e6e6e6;#f5f5f5;#f1f1f1" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="98" cy="139" r="0.8" fill="#111111">
    <animate attributeName="r" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="102" cy="139" r="0.8" fill="#111111">
    <animate attributeName="r" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </circle>
  <path d="M99 141 L101 141" stroke="#111111" stroke-width="0.5">
    <animate attributeName="stroke-width" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite" />
  </path>
  
  <!-- Enhanced dark aura effect -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#6c5ce7" stroke-width="1" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.4;0.1;0.3;0.2" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="70;75;68;72;70" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#6c5ce7" stroke-width="1" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.2;0.05;0.15;0.1" dur="4s" repeatCount="indefinite" />
    <animate attributeName="r" values="80;85;78;82;80" dur="4.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#2c3e50" stroke-width="0.5" opacity="0.05">
    <animate attributeName="opacity" values="0.05;0.1;0.02;0.08;0.05" dur="5s" repeatCount="indefinite" />
    <animate attributeName="r" values="90;95;88;92;90" dur="5.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Animated alarm clock showing Monday morning -->
  <circle cx="160" cy="150" r="10" fill="#f1f1f1" stroke="#111111" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 160 150;2 160 150;-2 160 150;0 160 150" dur="1s" repeatCount="indefinite" />
  </circle>
  <circle cx="160" cy="150" r="8" fill="none" stroke="#111111" stroke-width="0.5"/>
  <line x1="160" y1="150" x2="160" y2="145" stroke="#111111" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 160 150;90 160 150;180 160 150;270 160 150;360 160 150" dur="4s" repeatCount="indefinite" />
  </line>
  <line x1="160" y1="150" x2="165" y2="150" stroke="#111111" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 160 150;30 160 150;60 160 150;90 160 150;120 160 150;150 160 150;180 160 150;210 160 150;240 160 150;270 160 150;300 160 150;330 160 150;360 160 150" dur="12s" repeatCount="indefinite" />
  </line>
  <circle cx="160" cy="150" r="1" fill="#111111"/>
  <circle cx="160" cy="140" r="2" fill="#111111">
    <animate attributeName="opacity" values="1;0.5;1" dur="0.5s" repeatCount="indefinite" />
  </circle>
  <rect x="158" y="138" width="4" height="1" fill="#111111">
    <animate attributeName="opacity" values="1;0.5;1" dur="0.5s" repeatCount="indefinite" />
  </rect>
  
  <!-- Animated tiny bat silhouette -->
  <path d="M40 170 Q45 165 50 170 Q55 165 60 170 Q55 175 50 173 Q45 175 40 170" fill="#111111">
    <animateTransform attributeName="transform" type="translate" values="0,0;-5,-3;5,-2;-3,-4;0,0" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.7;1;0.8;1" dur="3s" repeatCount="indefinite" />
  </path>
  
  <!-- Additional gothic elements -->
  <!-- Floating Monday blues particles -->
  <circle cx="70" cy="60" r="1" fill="#6c5ce7" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,-5;2,-3;0,-8;-1,-2;0,0" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.2;0.8;0.3;0.6" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="130" cy="170" r="1.5" fill="#2c3e50" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0;3,-4;-2,-6;1,-2;0,0" dur="12s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.1;0.7;0.2;0.5" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="180" cy="80" r="0.8" fill="#111111" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0;-4,-2;2,-5;-1,-3;0,0" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.1;0.6;0.2;0.4" dur="3.5s" repeatCount="indefinite" />
  </circle>
</svg>