<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f4e4bc" stroke="#8b4513" stroke-width="3"/>
  
  <!-- Indiana Jones hat -->
  <ellipse cx="100" cy="75" rx="40" ry="15" fill="#654321"/>
  <ellipse cx="100" cy="70" rx="35" ry="12" fill="#8b4513"/>
  <path d="M65 70 Q100 60 135 70 L130 80 Q100 70 70 80 Z" fill="#a0522d"/>
  <!-- Hat band -->
  <rect x="75" y="72" width="50" height="4" fill="#2c1810"/>
  
  <!-- Face -->
  <ellipse cx="100" cy="110" rx="32" ry="38" fill="#fdbcb4"/>
  
  <!-- Eyes (slightly worried expression) -->
  <ellipse cx="92" cy="105" rx="5" ry="7" fill="white"/>
  <ellipse cx="108" cy="105" rx="5" ry="7" fill="white"/>
  <circle cx="92" cy="106" r="3" fill="#2c3e50"/>
  <circle cx="108" cy="106" r="3" fill="#2c3e50"/>
  <!-- Worried eyebrows -->
  <path d="M87 98 Q92 95 97 98" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  <path d="M103 98 Q108 95 113 98" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Nose -->
  <polygon points="100,115 96,123 104,123" fill="#f4a460"/>
  
  <!-- Mouth (slight smile) -->
  <path d="M94 132 Q100 137 106 132" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Stubble/beard shadow -->
  <ellipse cx="100" cy="125" rx="20" ry="15" fill="rgba(139,69,19,0.2)"/>
  
  <!-- Whip coiled on shoulder -->
  <circle cx="75" cy="150" r="8" fill="#8b4513">
    <animate attributeName="r" values="8;9;8" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="75" cy="150" r="6" fill="#a0522d">
    <animate attributeName="r" values="6;7;6" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="75" cy="150" r="4" fill="#654321">
    <animate attributeName="r" values="4;5;4" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Leather jacket -->
  <path d="M70 160 Q100 150 130 160 L135 185 Q100 175 65 185 Z" fill="#654321"/>
  <!-- Jacket collar -->
  <path d="M75 160 L85 155 L90 165 L80 170 Z" fill="#8b4513"/>
  <path d="M125 160 L115 155 L110 165 L120 170 Z" fill="#8b4513"/>
  
  <!-- Shirt -->
  <path d="M85 170 Q100 165 115 170 L110 185 Q100 180 90 185 Z" fill="#f5f5dc"/>
  
  <!-- Treasure map in hand -->
  <rect x="125" y="140" width="15" height="20" fill="#f4e4bc" stroke="#8b4513" stroke-width="1">
    <animate attributeName="opacity" values="1;0.8;1" dur="4s" repeatCount="indefinite" />
  </rect>
  <line x1="127" y1="145" x2="138" y2="145" stroke="#8b4513" stroke-width="1"/>
  <line x1="127" y1="150" x2="135" y2="150" stroke="#8b4513" stroke-width="1"/>
  <line x1="127" y1="155" x2="138" y2="155" stroke="#8b4513" stroke-width="1"/>
  <circle cx="132" cy="152" r="2" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ffff00;#ff0000" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Archaeological tools -->
  <!-- Small brush -->
  <rect x="45" y="135" width="2" height="15" fill="#8b4513"/>
  <rect x="43" y="135" width="6" height="3" fill="#daa520"/>
  
  <!-- Trowel -->
  <polygon points="50,155 55,150 58,155 53,160" fill="#c0c0c0"/>
  <rect x="52" y="160" width="2" height="8" fill="#8b4513"/>
  
  <!-- Scared expression elements -->
  <!-- Sweat drop -->
  <ellipse cx="115" cy="95" rx="2" ry="4" fill="#87ceeb">
    <animate attributeName="ry" values="4;6;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite" />
  </ellipse>
  
  <!-- Adventure hat feather -->
  <path d="M120 65 Q125 55 130 65" fill="#228b22" stroke="#006400" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 125 60;5 125 60;0 125 60" dur="4s" repeatCount="indefinite" />
  </path>
  
  <!-- Adventure aura -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#daa520" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="85;90;85" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="6s" repeatCount="indefinite" />
  </circle>
  
  <!-- Floating dust particles -->
  <circle cx="60" cy="80" r="1" fill="#daa520" opacity="0.6">
    <animate attributeName="cy" values="80;75;80" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="140" cy="120" r="1" fill="#8b4513" opacity="0.5">
    <animate attributeName="cy" values="120;115;120" dur="4s" repeatCount="indefinite" />
  </circle>
  <!-- Adventure enhancement elements -->
  <!-- Treasure map indicators -->
  <rect x="160" y="40" width="25" height="18" fill="#deb887" stroke="#8b4513" stroke-width="0.5" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </rect>
  <text x="162" y="47" font-family="serif" font-size="3" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite" />
    TREASURE
  </text>
  <text x="162" y="52" font-family="serif" font-size="3" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#dc143c;#ff0000" dur="3s" repeatCount="indefinite" />
    X MARKS
  </text>
  
  <!-- Ancient symbols -->
  <circle cx="30" cy="60" r="8" fill="none" stroke="#daa520" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="4s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#daa520;#ffd700;#daa520" dur="4s" repeatCount="indefinite" />
  </circle>
  <path d="M26 60 L34 60 M30 56 L30 64" stroke="#daa520" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="4s" repeatCount="indefinite" />
  </path>
  
  <!-- Exploration dust particles -->
  <circle cx="50" cy="140" r="1" fill="#daa520" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;3,-2;6,-4" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="130" r="0.8" fill="#cd853f" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,-1;-4,-2" dur="3.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Adventure compass -->
  <circle cx="170" cy="140" r="6" fill="none" stroke="#8b4513" stroke-width="1" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </circle>
  <path d="M170 134 L170 146 M164 140 L176 140" stroke="#8b4513" stroke-width="0.5" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </path>
  <path d="M170 140 L172 138" stroke="#ff0000" stroke-width="1" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 170 140;360 170 140" dur="8s" repeatCount="indefinite" />
  </path>
  
  <!-- Adventure aura -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#daa520" stroke-width="0.3" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite" />
    <animate attributeName="stroke-dasharray" values="0,440;220,220;0,440" dur="6s" repeatCount="indefinite" />
  </circle>
  
  <!-- Torch flame effect -->
  <ellipse cx="25" cy="30" rx="3" ry="5" fill="#ff4500" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="0.5s" repeatCount="indefinite" />
    <animate attributeName="ry" values="5;7;5" dur="0.8s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;1,-1;-1,-1;0,0" dur="1s" repeatCount="indefinite" />
  </ellipse>
  
</svg>