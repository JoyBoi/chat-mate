<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#e8f5e8" stroke="#228b22" stroke-width="3">
    <animate attributeName="fill" values="#e8f5e8;#d8f0d8;#e8f5e8" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#228b22;#32cd32;#228b22" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;4;3" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="40" ry="45" fill="#90ee90">
    <animate attributeName="fill" values="#90ee90;#98fb98;#90ee90" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Large ears -->
  <ellipse cx="60" cy="80" rx="15" ry="25" fill="#90ee90">
    <animate attributeName="fill" values="#90ee90;#98fb98;#90ee90" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="-2 60 80;2 60 80;-2 60 80" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="140" cy="80" rx="15" ry="25" fill="#90ee90">
    <animate attributeName="fill" values="#90ee90;#98fb98;#90ee90" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="2 140 80;-2 140 80;2 140 80" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Wrinkles -->
  <path d="M75 70 Q85 75 95 70" fill="none" stroke="#7cfc00" stroke-width="1">
    <animate attributeName="stroke" values="#7cfc00;#98fb98;#7cfc00" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;1.5;1" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M105 70 Q115 75 125 70" fill="none" stroke="#7cfc00" stroke-width="1">
    <animate attributeName="stroke" values="#7cfc00;#98fb98;#7cfc00" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="stroke-width" values="1;1.5;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  <path d="M80 85 Q90 90 100 85" fill="none" stroke="#7cfc00" stroke-width="1">
    <animate attributeName="stroke" values="#7cfc00;#98fb98;#7cfc00" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="stroke-width" values="1;1.5;1" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="85" rx="8" ry="10" fill="white">
    <animate attributeName="ry" values="10;8;10" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="115" cy="85" rx="8" ry="10" fill="white">
    <animate attributeName="ry" values="10;8;10" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </ellipse>
  <circle cx="85" cy="85" r="4" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#00ff00;#2c3e50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;3;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="85" r="4" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#00ff00;#2c3e50" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="r" values="4;3;4" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <!-- Nose -->
  <ellipse cx="100" cy="95" rx="3" ry="5" fill="#7cfc00"/>
  
  <!-- Mouth -->
  <path d="M95 105 Q100 110 105 105" fill="none" stroke="#228b22" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Gimer stick -->
  <line x1="140" y1="120" x2="140" y2="180" stroke="#8b4513" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 140 150;2 140 150;0 140 150" dur="4s" repeatCount="indefinite"/>
  </line>
  <circle cx="140" cy="115" r="3" fill="#654321">
    <animate attributeName="fill" values="#654321;#8b4513;#654321" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Robe -->
  <path d="M70 130 Q100 125 130 130 L135 190 Q100 185 65 190 Z" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Inner robe -->
  <path d="M80 140 Q100 135 120 140 L115 180 Q100 175 85 180 Z" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#ffd700;#daa520" dur="5s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  
  <!-- Code symbols floating around -->
  <text x="50" y="50" font-family="monospace" font-size="12" fill="#00ff00" opacity="0.7">
    <animate attributeName="fill" values="#00ff00;#32cd32;#00ff00" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.4;0.7" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,-2;0,0" dur="4s" repeatCount="indefinite"/>
    if
  </text>
  <text x="150" y="60" font-family="monospace" font-size="10" fill="#00ff00" opacity="0.7">
    <animate attributeName="fill" values="#00ff00;#32cd32;#00ff00" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.7;1;0.4;0.7" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;2,-1;0,0" dur="3.5s" repeatCount="indefinite"/>
    {}
  </text>
  <text x="40" y="150" font-family="monospace" font-size="8" fill="#00ff00" opacity="0.7">
    <animate attributeName="fill" values="#00ff00;#32cd32;#00ff00" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.7;1;0.4;0.7" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-1,2;0,0" dur="4.5s" repeatCount="indefinite"/>
    for
  </text>
  <text x="160" y="140" font-family="monospace" font-size="10" fill="#00ff00" opacity="0.7">
    <animate attributeName="fill" values="#00ff00;#32cd32;#00ff00" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="opacity" values="0.7;1;0.4;0.7" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;1,-2;0,0" dur="3s" repeatCount="indefinite"/>
    ;
  </text>
  
  <!-- Force aura -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.3">
    <animate attributeName="stroke" values="#00ff00;#32cd32;#00ff00" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="85;90;85" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="75" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.2">
    <animate attributeName="stroke" values="#00ff00;#32cd32;#00ff00" dur="6s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.2;0.5;0.1;0.2" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="75;80;75" dur="5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <!-- Hands -->
  <ellipse cx="75" cy="150" rx="8" ry="12" fill="#90ee90">
    <animate attributeName="fill" values="#90ee90;#98fb98;#90ee90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="8;9;8" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="125" cy="150" rx="8" ry="12" fill="#90ee90">
    <animate attributeName="fill" values="#90ee90;#98fb98;#90ee90" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="rx" values="8;9;8" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </ellipse>
  
  <!-- Programming wisdom aura -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#32cd32" stroke-width="0.5" opacity="0.1">
    <animate attributeName="stroke" values="#32cd32;#00ff00;#32cd32" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="95;100;95" dur="7s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Coding energy waves -->
  <path d="M20 100 Q50 90 80 100 Q110 110 140 100 Q170 90 200" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.2">
    <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M20 120 Q50 110 80 120 Q110 130 140 120 Q170 110 200" fill="none" stroke="#32cd32" stroke-width="1" opacity="0.15">
    <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,2;0,0" dur="3.5s" repeatCount="indefinite"/>
  </path>
  
</svg>