<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#fff8dc" stroke="#ff4500" stroke-width="3">
    <animate attributeName="fill" values="#fff8dc;#f5f5dc;#fff8dc" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#ff4500;#ff6347;#ff4500" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Chef hat -->
  <ellipse cx="100" cy="60" rx="35" ry="25" fill="#ffffff">
    <animate attributeName="fill" values="#ffffff;#f8f8ff;#ffffff" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="65" y="75" width="70" height="10" fill="#ffffff">
    <animate attributeName="fill" values="#ffffff;#f8f8ff;#ffffff" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Hat pleats -->
  <path d="M75 60 Q80 50 85 60" fill="none" stroke="#e0e0e0" stroke-width="1">
    <animate attributeName="stroke" values="#e0e0e0;#d3d3d3;#e0e0e0" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M90 60 Q95 50 100 60" fill="none" stroke="#e0e0e0" stroke-width="1">
    <animate attributeName="stroke" values="#e0e0e0;#d3d3d3;#e0e0e0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  <path d="M105 60 Q110 50 115 60" fill="none" stroke="#e0e0e0" stroke-width="1">
    <animate attributeName="stroke" values="#e0e0e0;#d3d3d3;#e0e0e0" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  <path d="M120 60 Q125 50 130 60" fill="none" stroke="#e0e0e0" stroke-width="1">
    <animate attributeName="stroke" values="#e0e0e0;#d3d3d3;#e0e0e0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </path>
  
  <!-- Face -->
  <ellipse cx="100" cy="110" rx="35" ry="40" fill="#fdbcb4">
    <animate attributeName="fill" values="#fdbcb4;#ffb3a7;#fdbcb4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Angry eyebrows -->
  <path d="M75 95 L95 100" fill="none" stroke="#8b4513" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M125 95 L105 100" fill="none" stroke="#8b4513" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="105" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;4;8" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="115" cy="105" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;4;8" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="85" cy="105" r="3" fill="#8b0000">
    <animate attributeName="fill" values="#8b0000;#a52a2a;#8b0000" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="105" r="3" fill="#8b0000">
    <animate attributeName="fill" values="#8b0000;#a52a2a;#8b0000" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Nose -->
  <polygon points="100,115 95,125 105,125" fill="#f4a460">
    <animate attributeName="fill" values="#f4a460;#e6b366;#f4a460" dur="3s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- Mouth (shouting) -->
  <ellipse cx="100" cy="135" rx="12" ry="8" fill="#8b0000">
    <animate attributeName="rx" values="12;14;12" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="8;9;8" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="100" cy="135" rx="8" ry="5" fill="#ff69b4">
    <animate attributeName="rx" values="8;9;8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="5;6;5" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Chef jacket -->
  <path d="M70 150 Q100 145 130 150 L135 190 Q100 185 65 190 Z" fill="#ffffff">
    <animate attributeName="fill" values="#ffffff;#f8f8ff;#ffffff" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Double-breasted buttons -->
  <circle cx="85" cy="160" r="3" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="160" r="3" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="85" cy="170" r="3" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="115" cy="170" r="3" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="85" cy="180" r="3" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="115" cy="180" r="3" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
  
  <!-- Wooden spoon -->
  <ellipse cx="140" cy="140" rx="6" ry="3" fill="#daa520">
    <animate attributeName="fill" values="#daa520;#e6c547;#daa520" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 140 140;10 140 140;0 140 140" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="138" y="143" width="4" height="20" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 140 140;10 140 140;0 140 140" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Steam/anger lines -->
  <path d="M75 85 L70 75" fill="none" stroke="#ff4500" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#ff4500;#ff6347;#ff4500" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-1,-2;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M125 85 L130 75" fill="none" stroke="#ff4500" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#ff4500;#ff6347;#ff4500" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;1,-2;0,0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  <path d="M100 85 L100 75" fill="none" stroke="#ff4500" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke" values="#ff4500;#ff6347;#ff4500" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="3s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- Sweat drops -->
  <circle cx="70" cy="100" r="2" fill="#87ceeb">
    <animate attributeName="cy" values="100;110;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;1;2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="100" r="2" fill="#87ceeb">
    <animate attributeName="cy" values="100;110;100" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="fill-opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="2;1;2" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <!-- Kitchen knife -->
  <rect x="50" y="155" width="15" height="3" fill="#c0c0c0">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;2,0;0,0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="45" y="153" width="5" height="7" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;2,0;0,0" dur="3s" repeatCount="indefinite"/>
  </rect>
  

  

  

  
  <!-- Culinary excellence aura -->
  <circle cx="100" cy="110" r="60" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="60;63;60" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#ffd700;#ffdf4d;#ffd700" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Frying pan with sizzling effects -->
  <ellipse cx="40" cy="170" rx="15" ry="5" fill="#696969">
    <animate attributeName="fill" values="#696969;#808080;#696969" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="-3 40 170;0 40 170;3 40 170;0 40 170" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="55" y="168" width="10" height="4" fill="#8b4513">
    <animate attributeName="fill" values="#8b4513;#a0522d;#8b4513" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="-3 40 170;0 40 170;3 40 170;0 40 170" dur="3s" repeatCount="indefinite"/>
  </rect>
  

  

  
  <!-- Food ingredients -->
  <circle cx="30" cy="180" r="5" fill="#ff6347">
    <animate attributeName="fill" values="#ff6347;#ff4500;#ff6347" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;5.5;5" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 30 180;10 30 180;0 30 180;-10 30 180;0 30 180" dur="4s" repeatCount="indefinite"/>
  </circle>
  <path d="M25 180 L35 180 M30 175 L30 185" fill="none" stroke="#006400" stroke-width="1">
    <animate attributeName="stroke" values="#006400;#008000;#006400" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 30 180;10 30 180;0 30 180;-10 30 180;0 30 180" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Salt shaker -->
  <rect x="40" cy="170" width="6" height="10" fill="#f5f5f5" rx="1">
    <animate attributeName="fill" values="#f5f5f5;#ffffff;#f5f5f5" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="-10 43 170;0 43 170;10 43 170;0 43 170;-10 43 170" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="41" cy="168" width="4" height="2" fill="#c0c0c0" rx="1">
    <animate attributeName="fill" values="#c0c0c0;#d3d3d3;#c0c0c0" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="-10 43 170;0 43 170;10 43 170;0 43 170;-10 43 170" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Salt particles -->
  <circle cx="43" cy="165" r="0.5" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0" dur="1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,-3;-4,-6" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="43" cy="165" r="0.5" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,-6" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="43" cy="165" r="0.5" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0" dur="1.1s" repeatCount="indefinite" begin="0.6s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;2,-3;4,-6" dur="1.1s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  
  <!-- Speech bubble with catchphrase -->
  <ellipse cx="50" cy="90" rx="25" ry="15" fill="#ffffff" stroke="#ff4500" stroke-width="1" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.8;0.9" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="25;26;25" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M70 100 L60 90" fill="none" stroke="#ff4500" stroke-width="1">
    <animate attributeName="opacity" values="0.9;0.8;0.9" dur="3s" repeatCount="indefinite"/>
  </path>
  <text x="50" y="93" font-family="Arial" font-size="6" fill="#ff4500" text-anchor="middle">
    <animate attributeName="fill" values="#ff4500;#ff6347;#ff4500" dur="3s" repeatCount="indefinite"/>
    IT'S RAW!
  </text>
</svg>