<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f0e6ff" stroke="#9370db" stroke-width="3"/>
  
  <!-- Bushy hair -->
  <path d="M60 70 Q100 40 140 70 Q150 90 140 110 Q120 130 80 130 Q60 110 60 90 Z" fill="#8b4513"/>
  <path d="M65 75 Q100 50 135 75 Q145 90 135 105 Q120 120 80 120 Q65 105 65 90 Z" fill="#a0522d"/>
  <!-- Hair highlights -->
  <path d="M70 80 Q85 65 100 80" fill="none" stroke="#d2b48c" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 60 Q110 70 120 65" fill="none" stroke="#d2b48c" stroke-width="3" stroke-linecap="round"/>
  <path d="M130 85 Q120 95 130 105" fill="none" stroke="#d2b48c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Witch hat -->
  <path d="M70 70 L100 30 L130 70 Z" fill="#2c3e50"/>
  <ellipse cx="100" cy="70" rx="35" ry="10" fill="#2c3e50"/>
  <!-- Hat band -->
  <path d="M70 68 Q100 63 130 68 Q100 73 70 68 Z" fill="#9370db"/>
  
  <!-- Face -->
  <ellipse cx="100" cy="100" rx="25" ry="30" fill="#fdbcb4"/>
  
  <!-- Eyes with condescending expression -->
  <ellipse cx="90" cy="95" rx="5" ry="7" fill="white"/>
  <ellipse cx="110" cy="95" rx="5" ry="7" fill="white"/>
  <circle cx="90" cy="95" r="3" fill="#2c3e50"/>
  <circle cx="110" cy="95" r="3" fill="#2c3e50"/>
  <!-- Eyebrows (raised in condescension) -->
  <path d="M85 88 Q90 85 95 88" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  <path d="M105 88 Q110 85 115 88" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Nose -->
  <polygon points="100,105 97,110 103,110" fill="#f4a460"/>
  
  <!-- Mouth (slight frown) -->
  <path d="M95 115 Q100 113 105 115" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Wizard robe -->
  <path d="M70 130 Q100 120 130 130 L135 180 Q100 170 65 180 Z" fill="#4b0082"/>
  
  <!-- Robe collar -->
  <path d="M80 130 Q100 125 120 130 L115 145 Q100 140 85 145 Z" fill="#9370db"/>
  
  <!-- Wand with glowing tip -->
  <rect x="130" y="120" width="30" height="3" rx="1" ry="1" fill="#8b4513"/>
  <circle cx="160" cy="121.5" r="5" fill="#ffff00" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#ffff00;#ff69b4;#9370db;#ffff00" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="160" cy="121.5" r="8" fill="#ffff00" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#ffff00;#ff69b4;#9370db;#ffff00" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="160" cy="121.5" r="12" fill="#ffffff" opacity="0.2">
    <animate attributeName="r" values="12;15;12" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Spell book -->
  <rect x="70" y="150" width="20" height="25" fill="#8b4513" stroke="#654321" stroke-width="1">
    <animate attributeName="opacity" values="1;0.9;1" dur="5s" repeatCount="indefinite" />
  </rect>
  <rect x="70" y="150" width="20" height="2" fill="#d4af37">
    <animate attributeName="fill" values="#d4af37;#ffff00;#d4af37" dur="3s" repeatCount="indefinite" />
  </rect>
  <rect x="70" y="173" width="20" height="2" fill="#d4af37">
    <animate attributeName="fill" values="#d4af37;#ffff00;#d4af37" dur="3s" repeatCount="indefinite" />
  </rect>
  <line x1="80" y1="155" x2="80" y2="170" stroke="#f0e6ff" stroke-width="1">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite" />
  </line>
  <line x1="75" y1="160" x2="85" y2="160" stroke="#f0e6ff" stroke-width="1">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.5s" repeatCount="indefinite" />
  </line>
  <line x1="75" y1="165" x2="85" y2="165" stroke="#f0e6ff" stroke-width="1">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite" />
  </line>
  
  <!-- House scarf -->
  <path d="M85 130 Q100 125 115 130 L110 140 Q100 135 90 140 Z" fill="#8f0000"/>
  <path d="M90 140 Q100 135 110 140 L105 150 Q100 145 95 150 Z" fill="#d4af37"/>
  
  <!-- Magical sparkles -->
  <circle cx="75" cy="110" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#ffffff;#ff69b4;#9370db;#ffffff" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="125" cy="105" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#ffffff;#ffff00;#ff69b4;#ffffff" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="145" cy="130" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#ffffff;#9370db;#00ffff;#ffffff" dur="1.8s" repeatCount="indefinite" />
  </circle>
  
  <!-- Additional magical effects -->
  <circle cx="50" cy="85" r="1" fill="#ff69b4" opacity="0.7">
    <animate attributeName="cy" values="85;80;85" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="95" r="1" fill="#9370db" opacity="0.6">
    <animate attributeName="cy" values="95;90;95" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Magical aura -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#9370db" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="88;93;88" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="6s" repeatCount="indefinite" />
  </circle>
</svg>