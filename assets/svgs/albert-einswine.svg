<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f0f8ff" stroke="#4169e1" stroke-width="3"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="35" ry="40" fill="#ffb6c1"/>
  
  <!-- Wild hair -->
  <path d="M70 60 Q100 35 130 60 L125 75 Q100 50 75 75 Z" fill="#d3d3d3">
    <animate attributeName="fill" values="#d3d3d3;#e6e6e6;#d3d3d3" dur="4s" repeatCount="indefinite" />
  </path>
  <path d="M65 65 Q60 45 55 65" fill="none" stroke="#d3d3d3" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0,0;-1,-1;1,-1;0,0" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#d3d3d3;#e6e6e6;#d3d3d3" dur="4s" repeatCount="indefinite" />
  </path>
  <path d="M75 50 Q70 30 65 50" fill="none" stroke="#d3d3d3" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0,0;1,-1;-1,-1;0,0" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#d3d3d3;#e6e6e6;#d3d3d3" dur="4s" repeatCount="indefinite" begin="0.5s" />
  </path>
  <path d="M125 50 Q130 30 135 50" fill="none" stroke="#d3d3d3" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0,0;-1,-1;1,-1;0,0" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#d3d3d3;#e6e6e6;#d3d3d3" dur="4s" repeatCount="indefinite" begin="1s" />
  </path>
  <path d="M135 65 Q140 45 145 65" fill="none" stroke="#d3d3d3" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0,0;1,-1;-1,-1;0,0" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#d3d3d3;#e6e6e6;#d3d3d3" dur="4s" repeatCount="indefinite" begin="1.5s" />
  </path>
  <path d="M100 45 Q105 25 110 45" fill="none" stroke="#d3d3d3" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="4s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#d3d3d3;#e6e6e6;#d3d3d3" dur="4s" repeatCount="indefinite" begin="2s" />
  </path>
  
  <!-- Pig snout -->
  <ellipse cx="100" cy="100" rx="12" ry="8" fill="#ff69b4">
    <animate attributeName="ry" values="8;9;7;8" dur="2s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#ff69b4;#ff1493;#ff69b4" dur="3s" repeatCount="indefinite" />
  </ellipse>
  <circle cx="95" cy="98" r="2" fill="#8b008b">
    <animate attributeName="r" values="2;2.5;2" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="105" cy="98" r="2" fill="#8b008b">
    <animate attributeName="r" values="2;2.5;2" dur="1.5s" repeatCount="indefinite" begin="0.5s" />
  </circle>
  
  <!-- Animated eyes -->
  <ellipse cx="85" cy="80" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;2;8" dur="6s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="115" cy="80" rx="6" ry="8" fill="white">
    <animate attributeName="ry" values="8;2;8" dur="6s" repeatCount="indefinite" />
  </ellipse>
  <circle cx="85" cy="80" r="3" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#4169e1;#2c3e50" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="115" cy="80" r="3" fill="#2c3e50">
    <animate attributeName="fill" values="#2c3e50;#4169e1;#2c3e50" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Genius sparkles -->
  <circle cx="70" cy="65" r="1" fill="#ffff00" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.9;0.3;0.8" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;-1,-2;1,-1;0,-3;0,0" dur="3s" repeatCount="indefinite" additive="sum" />
  </circle>
  <circle cx="130" cy="70" r="1.5" fill="#4169e1" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.8;0.2;0.7" dur="2.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;2,-1;-1,-2;1,-3;0,0" dur="3.5s" repeatCount="indefinite" additive="sum" />
  </circle>
  
  <!-- Eyebrows -->
  <path d="M75 70 L95 73" fill="none" stroke="#d3d3d3" stroke-width="3" stroke-linecap="round"/>
  <path d="M125 70 L105 73" fill="none" stroke="#d3d3d3" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Mustache -->
  <ellipse cx="100" cy="110" rx="15" ry="4" fill="#d3d3d3">
    <animate attributeName="rx" values="15;16;14;15" dur="3s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#d3d3d3;#e6e6e6;#d3d3d3" dur="4s" repeatCount="indefinite" />
  </ellipse>
  
  <!-- Mouth -->
  <path d="M90 120 Q100 125 110 120" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Sweater vest -->
  <path d="M70 130 Q100 125 130 130 L135 190 Q100 185 65 190 Z" fill="#8b4513"/>
  
  <!-- Shirt -->
  <path d="M80 140 Q100 135 120 140 L115 175 Q100 170 85 175 Z" fill="white"/>
  
  <!-- Bow tie -->
  <polygon points="95,140 105,140 110,145 105,150 95,150 90,145" fill="#ff4500"/>
  <rect x="97" y="142" width="6" height="6" fill="#654321"/>
  
  <!-- Animated E=mc² formula -->
  <text x="40" y="120" font-family="Arial" font-size="12" fill="#4169e1">
    <animate attributeName="opacity" values="1;0.6;1;0.8;1" dur="3s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#4169e1;#ff6347;#4169e1;#ffff00;#4169e1" dur="5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0;0,-1;0,0" dur="4s" repeatCount="indefinite" additive="sum" />
    E=mc²
  </text>
  
  <!-- Animated chalkboard -->
  <rect x="130" y="110" width="25" height="20" fill="#2f4f4f">
    <animate attributeName="fill" values="#2f4f4f;#1c3333;#2f4f4f" dur="6s" repeatCount="indefinite" />
  </rect>
  <text x="135" y="125" font-family="Arial" font-size="8" fill="white">
    <animate attributeName="opacity" values="1;0.7;1;0.9;1" dur="4s" repeatCount="indefinite" />
    π=3.14
  </text>
  
  <!-- Pipe -->
  <ellipse cx="125" cy="115" rx="6" ry="3" fill="#8b4513"/>
  <rect x="131" y="113" width="10" height="4" fill="#654321"/>
  
  <!-- Animated smoke -->
  <path d="M141 115 Q145 110 149 105 Q153 100 157 95" fill="none" stroke="#d3d3d3" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.8;0.4;0.7" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;-1,-1;1,-2;-0.5,-1;0,0" dur="4s" repeatCount="indefinite" additive="sum" />
  </path>
  <path d="M143 113 Q147 108 151 103 Q155 98 159 93" fill="none" stroke="#d3d3d3" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.6;0.3;0.5" dur="3.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;1,-1;-1,-2;0.5,-1;0,0" dur="4.5s" repeatCount="indefinite" additive="sum" />
  </path>
  
  <!-- Animated relativity symbols -->
  <circle cx="50" cy="160" r="8" fill="none" stroke="#4169e1" stroke-width="2">
    <animate attributeName="r" values="8;10;7;9;8" dur="4s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#4169e1;#ff6347;#4169e1;#ffff00;#4169e1" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.6;1;0.8;1" dur="3s" repeatCount="indefinite" />
  </circle>
  <path d="M42 160 L58 160" fill="none" stroke="#4169e1" stroke-width="2">
    <animate attributeName="stroke" values="#4169e1;#ff6347;#4169e1;#ffff00;#4169e1" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.6;1;0.8;1" dur="3s" repeatCount="indefinite" />
  </path>
  <path d="M50 152 L50 168" fill="none" stroke="#4169e1" stroke-width="2">
    <animate attributeName="stroke" values="#4169e1;#ff6347;#4169e1;#ffff00;#4169e1" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.6;1;0.8;1" dur="3s" repeatCount="indefinite" />
  </path>
  
  <!-- Animated light waves -->
  <path d="M160 140 Q165 135 170 140 Q175 145 180 140" fill="none" stroke="#ffff00" stroke-width="2" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.9;0.5;0.7" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#ffff00;#ff6347;#ffff00;#4169e1;#ffff00" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;5,0;10,0;15,0;20,0" dur="2s" repeatCount="indefinite" additive="sum" />
  </path>
  <path d="M160 145 Q165 140 170 145 Q175 150 180 145" fill="none" stroke="#ffff00" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.7;0.3;0.5" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#ffff00;#4169e1;#ffff00;#ff6347;#ffff00" dur="3.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;4,0;8,0;12,0;16,0" dur="2.5s" repeatCount="indefinite" additive="sum" />
  </path>
  
  <!-- Animated atoms -->
  <circle cx="35" cy="180" r="4" fill="none" stroke="#ff6347" stroke-width="1">
    <animate attributeName="r" values="4;5;3;4.5;4" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#ff6347;#4169e1;#ff6347;#ffff00;#ff6347" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="35" cy="180" r="1" fill="#ff6347">
    <animate attributeName="fill" values="#ff6347;#4169e1;#ff6347;#ffff00;#ff6347" dur="4s" repeatCount="indefinite" />
    <animate attributeName="r" values="1;1.5;0.8;1.2;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <ellipse cx="35" cy="180" rx="6" ry="2" fill="none" stroke="#ff6347" stroke-width="1" transform="rotate(45 35 180)">
    <animateTransform attributeName="transform" type="rotate" values="45 35 180;135 35 180;225 35 180;315 35 180;405 35 180" dur="4s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#ff6347;#4169e1;#ff6347;#ffff00;#ff6347" dur="4s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="35" cy="180" rx="6" ry="2" fill="none" stroke="#ff6347" stroke-width="1" transform="rotate(-45 35 180)">
    <animateTransform attributeName="transform" type="rotate" values="-45 35 180;45 35 180;135 35 180;225 35 180;315 35 180" dur="5s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#ff6347;#ffff00;#ff6347;#4169e1;#ff6347" dur="5s" repeatCount="indefinite" />
  </ellipse>
  
  <!-- Quantum particles -->
  <circle cx="160" cy="180" r="1.5" fill="#4169e1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.9;0.3;0.8" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="r" values="1.5;2;1;1.8;1.5" dur="2s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#4169e1;#ff6347;#4169e1;#ffff00;#4169e1" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;-5,-5;5,-10;-5,-15;0,-20" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="165" cy="180" r="1.2" fill="#ff6347" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.8;0.2;0.7" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="r" values="1.2;1.8;0.8;1.5;1.2" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#ff6347;#4169e1;#ff6347;#ffff00;#ff6347" dur="3.2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;5,-5;-5,-10;5,-15;0,-20" dur="3.3s" repeatCount="indefinite" />
  </circle>
  <circle cx="170" cy="180" r="1" fill="#ffff00" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.7;0.2;0.6" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="1;1.5;0.7;1.3;1" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#ffff00;#4169e1;#ffff00;#ff6347;#ffff00" dur="3.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0,0;-3,-5;3,-10;-3,-15;0,-20" dur="3.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Thought bubble with equations -->
  <ellipse cx="150" cy="60" rx="20" ry="15" fill="white" stroke="#d3d3d3" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.9;0.7;0.8" dur="4s" repeatCount="indefinite" />
    <animate attributeName="rx" values="20;21;19;20" dur="5s" repeatCount="indefinite" />
    <animate attributeName="ry" values="15;16;14;15" dur="5s" repeatCount="indefinite" />
  </ellipse>
  <circle cx="135" cy="80" r="5" fill="white" stroke="#d3d3d3" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.9;0.7;0.8" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="125" cy="85" r="3" fill="white" stroke="#d3d3d3" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.9;0.7;0.8" dur="4s" repeatCount="indefinite" />
  </circle>
  <text x="140" y="60" font-family="Arial" font-size="6" fill="#4169e1">
    <animate attributeName="fill" values="#4169e1;#ff6347;#4169e1;#ffff00;#4169e1" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.7;1;0.8;1" dur="3s" repeatCount="indefinite" />
    F=ma
  </text>
  <text x="140" y="68" font-family="Arial" font-size="6" fill="#ff6347">
    <animate attributeName="fill" values="#ff6347;#4169e1;#ff6347;#ffff00;#ff6347" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.7;1;0.8;1" dur="3s" repeatCount="indefinite" begin="0.5s" />
    E=hf
  </text>
  
  <!-- Time dilation effect -->
  <path d="M60 40 Q65 35 70 40" fill="none" stroke="#4169e1" stroke-width="1" stroke-dasharray="2,1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.7;0.3;0.6" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#4169e1;#ff6347;#4169e1;#ffff00;#4169e1" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="scale" values="1;1.2;0.9;1.1;1" dur="5s" repeatCount="indefinite" additive="sum" />
  </path>
  <path d="M60 45 Q65 40 70 45" fill="none" stroke="#ff6347" stroke-width="1" stroke-dasharray="2,1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.6;0.2;0.5" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#ff6347;#4169e1;#ff6347;#ffff00;#ff6347" dur="4.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="scale" values="1;0.9;1.1;0.8;1" dur="5.5s" repeatCount="indefinite" additive="sum" />
  </path>
  
  <!-- Gravity well -->
  <ellipse cx="75" cy="150" rx="10" ry="5" fill="none" stroke="#4169e1" stroke-width="1" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.8;0.4;0.7" dur="4s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#4169e1;#ff6347;#4169e1;#ffff00;#4169e1" dur="5s" repeatCount="indefinite" />
    <animate attributeName="rx" values="10;11;9;10.5;10" dur="6s" repeatCount="indefinite" />
    <animate attributeName="ry" values="5;5.5;4.5;5.2;5" dur="6s" repeatCount="indefinite" />
  </ellipse>
  <circle cx="75" cy="150" r="2" fill="#4169e1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.9;0.5;0.8" dur="3s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#4169e1;#ff6347;#4169e1;#ffff00;#4169e1" dur="4s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;2.5;1.8;2.3;2" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>